['un acteur → une ___',['actrice','acteuse','acteure'],0,'-teur → -trice.'],
['Which noun is most likely feminine?',['liberté','fromage','gâteau'],0,'-té → feminine: la liberté.']],
s:[['o','Les chevaux sont dans le champ.','The horses are in the field.'],['w','un prix → des ___','prix','ends in -x','Nouns ending in -s, -x, -z do not change.']]},

/* 3 */ {lvl:'A1',title:'Être & avoir',sub:'to be and to have',body:`
<div class="tw"><table class="gt"><tr><th></th><th>être · to be</th><th>avoir · to have</th></tr>
<tr><td>je</td><td><b>suis</b></td><td><b>ai</b> (j'ai)</td></tr>
<tr><td>tu</td><td><b>es</b></td><td><b>as</b></td></tr>
<tr><td>il / elle / on</td><td><b>est</b></td><td><b>a</b></td></tr>
<tr><td>nous</td><td><b>sommes</b></td><td><b>avons</b></td></tr>
<tr><td>vous</td><td><b>êtes</b></td><td><b>avez</b></td></tr>
<tr><td>ils / elles</td><td><b>sont</b></td><td><b>ont</b></td></tr></table></div>
<p>Where English uses "to be", French often uses <b>avoir</b>: age, hunger, thirst, heat, cold, fear. <span class="ex">J'ai 25 ans</span> = I am 25. <span class="ex">J'ai faim</span> = I'm hungry.</p>
<div class="tip">Listen for the liaison: <i>ils sont</i> sounds like "eel sohn", <i>ils ont</i> like "eel zohn". The z-sound means "have".</div>`,
ex:[['Je ___ anglais.',['suis','ai','es'],0,'je suis.'],
['Nous ___ deux enfants.',['avons','sommes','avez'],0,'nous avons.'],
['Vous ___ fatigués ?',['êtes','avez','sont'],0,'vous êtes.'],
['Elle ___ 20 ans.',['a','est','as'],0,'Age uses avoir.'],
['Ils ___ au cinéma.',['sont','ont','est'],0,'ils sont.'],
['Tu ___ faim ?',['as','es','a'],0,'avoir faim = to be hungry.']],
s:[['o',"J'ai froid et je suis fatigué.","I'm cold and I'm tired."],['w','Vous ___ très gentils.','êtes','être, vous','vous êtes.']]},

/* 4 */ {lvl:'A1',title:'Regular -er verbs',sub:'parler, aimer, habiter…',body:`
<p>About 90% of French verbs end in <b>-er</b> and follow one pattern: drop -er, add the ending.</p>
<div class="tw"><table class="gt"><tr><th>person</th><th>ending</th><th>parler</th></tr>
<tr><td>je</td><td>-e</td><td>parl<b>e</b></td></tr>
<tr><td>tu</td><td>-es</td><td>parl<b>es</b></td></tr>
<tr><td>il / elle / on</td><td>-e</td><td>parl<b>e</b></td></tr>
<tr><td>nous</td><td>-ons</td><td>parl<b>ons</b></td></tr>
<tr><td>vous</td><td>-ez</td><td>parl<b>ez</b></td></tr>
<tr><td>ils / elles</td><td>-ent</td><td>parl<b>ent</b></td></tr></table></div>
<p>-e, -es and -ent are silent: <i>parle, parles, parlent</i> sound the same. Before a vowel <b>je → j'</b>: <span class="ex">j'aime, j'habite</span>.</p>
<div class="tip">Spelling quirks: <i>nous mangeons</i>, <i>nous commençons</i>, <i>j'achète</i>, <i>j'appelle</i>.</div>`,
ex:[['Tu ___ français ?',['parles','parle','parlez'],0,'tu → -es.'],
['Nous ___ à Londres.',['habitons','habitez','habitent'],0,'nous → -ons.'],
['Ils ___ la télé.',['regardent','regardons','regarde'],0,'ils → -ent.'],
['___ aime le chocolat.',["J'",'Je','Ja'],0,"je becomes j' before a vowel."],
['Vous ___ ici ?',['travaillez','travaillons','travailles'],0,'vous → -ez.'],
['Nous ___ à 8 heures.',['mangeons','mangons','mangez'],0,'manger keeps the e: nous mangeons.']],
s:[['o','Nous écoutons la radio le matin.','We listen to the radio in the morning.'],['w','Elles ___ (chanter) très bien.','chantent','chanter, elles','ils/elles → -ent.']]},

/* 5 */ {lvl:'A1',title:'Six key irregular verbs',sub:'aller · faire · venir · prendre · pouvoir · vouloir',body:`
<div class="tw"><table class="gt"><tr><th></th><th>aller</th><th>faire</th><th>venir</th><th>prendre</th><th>pouvoir</th><th>vouloir</th></tr>
<tr><td>je</td><td>vais</td><td>fais</td><td>viens</td><td>prends</td><td>peux</td><td>veux</td></tr>
<tr><td>tu</td><td>vas</td><td>fais</td><td>viens</td><td>prends</td><td>peux</td><td>veux</td></tr>
<tr><td>il/elle</td><td>va</td><td>fait</td><td>vient</td><td>prend</td><td>peut</td><td>veut</td></tr>
<tr><td>nous</td><td>allons</td><td>faisons</td><td>venons</td><td>prenons</td><td>pouvons</td><td>voulons</td></tr>
<tr><td>vous</td><td>allez</td><td>faites</td><td>venez</td><td>prenez</td><td>pouvez</td><td>voulez</td></tr>
<tr><td>ils/elles</td><td>vont</td><td>font</td><td>viennent</td><td>prennent</td><td>peuvent</td><td>veulent</td></tr></table></div>
<p>With être and avoir, these are the most frequent verbs in the language. Learn them by heart.</p>
<div class="tip">Polite request: <i>Je voudrais un café</i> = I would like a coffee. <i>Pouvez-vous m'aider ?</i> = Can you help me?</div>`,
ex:[['Je ___ à Paris demain.',['vais','va','allons'],0,'aller: je vais.'],
["Qu'est-ce que vous ___ ce soir ?",['faites','faisez','fais'],0,'faire: vous faites (irregular).'],
['Ils ___ de Lyon.',['viennent','venent','vient'],0,'venir: ils viennent.'],
['Tu ___ le bus ?',['prends','prend','prenez'],0,'prendre: tu prends.'],
['Nous ne ___ pas venir.',['pouvons','peuvons','peuvent'],0,'pouvoir: nous pouvons.'],
['Elle ___ un café.',['veut','veux','voulez'],0,'vouloir: elle veut.']],
s:[['o','Ils vont au marché le samedi.','They go to the market on Saturdays.'],['w','Qu\'est-ce que tu ___ (faire) ce week-end ?','fais','faire, tu','tu fais.']]},

/* 6 */ {lvl:'A1',title:'Negation',sub:'ne… pas, ne… jamais, ne… rien',body:`
<p>Negation wraps around the verb: <b>ne</b> + verb + <b>pas</b>. Before a vowel, ne becomes <b>n'</b>.</p>
<p class="ex">Je parle → Je ne parle pas. · J'aime → Je n'aime pas.</p>
<div class="tw"><table class="gt"><tr><th>form</th><th>meaning</th><th>example</th></tr>
<tr><td>ne… pas</td><td>not</td><td>Je ne sais pas.</td></tr>
<tr><td>ne… jamais</td><td>never</td><td>Il ne mange jamais de viande.</td></tr>
<tr><td>ne… rien</td><td>nothing</td><td>Je ne vois rien.</td></tr>
<tr><td>ne… personne</td><td>nobody</td><td>Je ne connais personne.</td></tr>
<tr><td>ne… plus</td><td>no longer</td><td>Elle ne fume plus.</td></tr></table></div>
<div class="tip">In speech the <i>ne</i> often disappears: <i>Je sais pas</i>, <i>C'est pas grave</i>. Recognise it, but write it.</div>`,
ex:[['Je ___ parle ___ allemand.',['ne / pas','pas / ne','non / pas'],0,'ne + verb + pas.'],
["Il ___ aime pas le café.",["n'",'ne','non'],0,"Before a vowel: n'."],
['Elle ne mange ___ de viande. (never)',['jamais','rien','personne'],0,'ne… jamais = never.'],
['Je ne vois ___. (nobody)',['personne','rien','plus'],0,'ne… personne = nobody.'],
['Nous ne travaillons ___ ici. (no longer)',['plus','pas','jamais'],0,'ne… plus = no longer.'],
['Il ne fait ___. (nothing)',['rien','personne','jamais'],0,'ne… rien = nothing.']],
s:[['o',"Je ne regarde jamais la télé.","I never watch TV."],['w',"Tu n'as ___ faim ? (no longer)",'plus','ne… plus','ne… plus = no longer.']]},

/* 7 */ {lvl:'A1',title:'Asking questions',sub:'intonation · est-ce que · inversion',body:`
<div class="tw"><table class="gt"><tr><th>register</th><th>structure</th><th>example</th></tr>
<tr><td>spoken</td><td>rising intonation</td><td>Tu viens ?</td></tr>
<tr><td>standard</td><td>est-ce que + sentence</td><td>Est-ce que tu viens ?</td></tr>
<tr><td>formal</td><td>verb–subject</td><td>Viens-tu ?</td></tr></table></div>
<p>With question words: <span class="ex">Où tu habites ?</span> · <span class="ex">Où est-ce que tu habites ?</span> · <span class="ex">Où habites-tu ?</span></p>
<ul><li><b>Qu'est-ce que</b> = what (object): Qu'est-ce que tu manges ?</li>
<li><b>Quel / quelle / quels / quelles</b> agrees with the noun: Quelle heure est-il ?</li>
<li>In inversion with il/elle, add <b>-t-</b> between two vowels: Parle-t-il français ?</li></ul>`,
ex:[['___ tu habites ? — À Lyon.',['Où','Quand','Qui'],0,'The answer is a place: où.'],
['___ tu fais ce soir ?',["Qu'est-ce que","Qui est-ce que","Où est-ce que"],0,"What = qu'est-ce que."],
['___ coûte ce livre ?',['Combien','Comment','Pourquoi'],0,'Price: combien.'],
['Parle-___-il anglais ?',['t','s','l'],0,'Add -t- between two vowels.'],
['___ vous appelez-vous ?',['Comment','Quel','Où'],0,'Comment vous appelez-vous ? = What is your name?'],
['___ heure est-il ?',['Quelle','Quel',"Qu'"],0,'heure is feminine: quelle.']],
s:[['o','Est-ce que tu aimes le fromage ?','Do you like cheese?'],['w','___ est-ce que tu pars ? — Demain.','Quand','time question','The answer is a time: quand.']]},

/* 8 */ {lvl:'A1',title:'Adjectives',sub:'agreement and position',body:`
<p>Adjectives agree with the noun: <b>+e</b> for feminine, <b>+s</b> for plural.</p>
<div class="tw"><table class="gt"><tr><th></th><th>singular</th><th>plural</th></tr>
<tr><td>masculine</td><td>petit</td><td>petit<b>s</b></td></tr>
<tr><td>feminine</td><td>petit<b>e</b></td><td>petit<b>es</b></td></tr></table></div>
<ul><li>Already ending in -e? No change: jeune, calme, triste.</li>
<li>-eux → <b>-euse</b> (heureuse) · -if → <b>-ive</b> (sportive) · bon → <b>bonne</b> · blanc → <b>blanche</b></li>
<li>Irregular: beau → <b>belle</b>, vieux → <b>vieille</b>, nouveau → <b>nouvelle</b>. Before a masculine vowel: <i>un bel homme, un vieil ami, un nouvel appartement</i>.</li></ul>
<div class="tip">Position: usually <b>after</b> the noun (une voiture rouge). Short, common ones go before: beau, joli, jeune, vieux, nouveau, bon, mauvais, grand, petit.</div>`,
ex:[['une maison ___',['blanche','blanc','blancs'],0,'blanc → blanche (irregular).'],
['Elle est très ___.',['heureuse','heureux','heureuze'],0,'-eux → -euse.'],
["C'est une ___ idée.",['bonne','bon','bone'],0,'bon → bonne.'],
['Les filles sont ___.',['petites','petits','petite'],0,'Feminine plural: -es.'],
['un ___ homme (old)',['vieil','vieux','vieille'],0,'Before a masculine vowel: vieil.'],
['Which order is correct?',['une voiture rouge','une rouge voiture','rouge une voiture'],0,'Colours go after the noun.']],
s:[['o','Nous avons une grande maison blanche.','We have a big white house.'],['w','Ma sœur est très ___ (sportif).','sportive','feminine of sportif','-if → -ive.']]},

/* 9 */ {lvl:'A1',title:'Possessives & demonstratives',sub:'mon · ma · mes · ce · cette',body:`
<div class="tw"><table class="gt"><tr><th></th><th>m</th><th>f</th><th>plural</th></tr>
<tr><td>my</td><td>mon</td><td>ma</td><td>mes</td></tr>
<tr><td>your (tu)</td><td>ton</td><td>ta</td><td>tes</td></tr>
<tr><td>his / her</td><td>son</td><td>sa</td><td>ses</td></tr>
<tr><td>our</td><td colspan="2">notre</td><td>nos</td></tr>
<tr><td>your (vous)</td><td colspan="2">votre</td><td>vos</td></tr>
<tr><td>their</td><td colspan="2">leur</td><td>leurs</td></tr></table></div>
<p>The possessive agrees with the thing owned, not the owner: <span class="ex">son livre</span> = his book or her book; <span class="ex">sa voiture</span> = his car or her car.</p>
<p>Before a feminine word starting with a vowel use <b>mon/ton/son</b>: <i>mon amie, mon école</i>.</p>
<div class="tip">Demonstratives: <b>ce</b> livre · <b>cet</b> homme (m + vowel) · <b>cette</b> maison · <b>ces</b> livres.</div>`,
ex:[["___ mère s'appelle Anna.",['Ma','Mon','Mes'],0,'mère is feminine: ma.'],
["C'est ___ amie Julie.",['mon','ma','mes'],0,'Feminine + vowel: mon.'],
['Paul aime ___ sœur.',['sa','son','ses'],0,"sœur is feminine: sa. Paul's gender doesn't matter."],
['Ils ont vendu ___ maison.',['leur','leurs','son'],0,'One house, several owners: leur.'],
['___ homme est mon prof.',['Cet','Ce','Cette'],0,'Masculine + vowel/silent h: cet.'],
["J'aime ___ chaussures.",['ces','cette','cet'],0,'Plural: ces.']],
s:[['o','Cette voiture est à mon frère.',"This car is my brother's."],['w','Nous aimons ___ quartier. (our)','notre','our, singular','notre for a singular noun.']]},

/* 10 */ {lvl:'A1',title:'Prepositions & places',sub:'au · aux · du · en France · à Paris',body:`
<div class="tw"><table class="gt"><tr><th>contraction</th><th>example</th></tr>
<tr><td>à + le = <b>au</b></td><td>Je vais au cinéma.</td></tr>
<tr><td>à + les = <b>aux</b></td><td>Je parle aux enfants.</td></tr>
<tr><td>de + le = <b>du</b></td><td>Je reviens du marché.</td></tr>
<tr><td>de + les = <b>des</b></td><td>la voiture des voisins</td></tr></table></div>
<p><b>à la, à l', de la, de l'</b> do not contract.</p>
<ul><li>Cities: <b>à</b> Paris, <b>à</b> Londres</li>
<li>Feminine countries (most ending in -e): <b>en</b> France, <b>en</b> Italie</li>
<li>Masculine countries: <b>au</b> Canada, <b>au</b> Japon · plural: <b>aux</b> États-Unis</li>
<li>Transport: <b>en</b> voiture, <b>en</b> train, but <b>à</b> pied, <b>à</b> vélo</li></ul>
<div class="tip"><b>chez</b> + person = at someone's place: chez moi, chez le médecin.</div>`,
ex:[['Je vais ___ cinéma.',['au','à le','à la'],0,'à + le = au.'],
['Elle habite ___ Italie.',['en','au','à'],0,'Feminine country: en.'],
['Nous allons ___ Rome.',['à','en','au'],0,'City: à.'],
['Il parle ___ enfants.',['aux','à les','des'],0,'à + les = aux.'],
['Je reviens ___ marché.',['du','de le','de la'],0,'de + le = du.'],
['On va ___ moi ?',['chez','à','au'],0,'chez moi = to my place.']],
s:[['o','Mes parents habitent au Canada.','My parents live in Canada.'],['w','Je vais au travail ___ vélo.','à','by bike','à pied, à vélo.']]},

/* 11 */ {lvl:'A1',title:"C'est, il est, il y a, il faut",sub:'four structures you use everywhere',body:`
<ul><li><b>C'est</b> + article/name/pronoun: <span class="ex">C'est un ami. C'est Marie. C'est moi.</span></li>
<li><b>Il / Elle est</b> + adjective, or job with no article: <span class="ex">Il est grand. Elle est médecin.</span></li>
<li><b>C'est</b> + adjective to comment on a situation: <span class="ex">C'est beau ! C'est difficile.</span></li>
<li><b>Il y a</b> = there is / there are, never changes: <span class="ex">Il y a un problème. Il y a trois chambres.</span></li>
<li><b>Il y a</b> + time = ago: <span class="ex">Je suis arrivé il y a deux ans.</span></li>
<li><b>Il faut</b> + infinitive or noun = you have to / it takes: <span class="ex">Il faut partir. Il faut du temps.</span></li></ul>
<div class="tip">Classic mistake: «Il est un bon professeur». With an article, say <i>C'est un bon professeur</i>.</div>`,
ex:[['___ mon frère.',["C'est",'Il est','Il y a'],0,"With a possessive or article: c'est."],
['Mon frère ? ___ médecin.',['Il est',"C'est",'Il y a'],0,'Job without article: il est.'],
['___ beaucoup de monde ici.',['Il y a',"C'est",'Il faut'],0,'There are a lot of people: il y a.'],
['___ partir maintenant, il est tard.',['Il faut','Il y a',"C'est"],0,'We must = il faut.'],
['Je suis arrivé ___ deux ans. (ago)',['il y a','depuis','il faut'],0,'il y a + time = ago.'],
['Regarde ce paysage ! ___ magnifique !',["C'est",'Il est','Il y a'],0,"Commenting on a situation: c'est."]],
s:[['o',"Il y a un bon restaurant près d'ici.","There's a good restaurant near here."],['w',"___ un livre très intéressant.","C'est",'it is + article',"Before un/une: c'est."]]},

/* 12 */ {lvl:'A1',title:'Time, dates & numbers',sub:'il est 3 h · le 14 juillet · soixante-dix',body:`
<p><b>Telling the time</b>: <span class="ex">Il est trois heures.</span> Add minutes: <i>trois heures dix</i>. Quarters and halves: <i>et quart</i>, <i>et demie</i>, <i>moins le quart</i>. <i>midi</i> = noon, <i>minuit</i> = midnight.</p>
<div class="tw"><table class="gt"><tr><th>time</th><th>French</th></tr>
<tr><td>8:15</td><td>huit heures et quart</td></tr>
<tr><td>8:30</td><td>huit heures et demie</td></tr>
<tr><td>8:45</td><td>neuf heures moins le quart</td></tr>
<tr><td>20:00</td><td>vingt heures (timetables use 24 h)</td></tr></table></div>
<p><b>Dates</b>: <span class="ex">le 14 juillet</span>, <span class="ex">le premier mai</span> (only the 1st is ordinal). Days and months take no capital letter. <i>En 2026</i> = in 2026.</p>
<div class="tip">70 = soixante-dix (60+10), 80 = quatre-vingts (4×20), 90 = quatre-vingt-dix (4×20+10). In Belgium and Switzerland: septante, nonante.</div>`,
ex:[['10:30 = dix heures ___',['et demie','et quart','moins le quart'],0,'Half past: et demie.'],
['7:45 = ___ heures moins le quart',['huit','sept','six'],0,'Quarter to eight.'],
['May 1st = le ___ mai',['premier','un','première'],0,'Only the 1st uses the ordinal.'],
['75 = ___',['soixante-quinze','septante-cinq','soixante-dix-cinq'],0,'60 + 15.'],
['92 = ___',['quatre-vingt-douze','quatre-vingt-dix-deux','nonante-deux'],0,'4×20 + 12.'],
['___ 2026, je vais en France.',['En','À','Dans'],0,'Years: en.']],
s:[['o','Le train part à huit heures et quart.','The train leaves at quarter past eight.'],['w','Mon anniversaire est le ___ juin. (1st)','premier','1st','le premier.']]},

/* 13 */ {lvl:'A1',title:'-ir and -re verbs',sub:'finir · partir · attendre',body:`
<p>Three more patterns cover most remaining verbs.</p>
<div class="tw"><table class="gt"><tr><th></th><th>finir (type 2)</th><th>partir (type 3)</th><th>attendre (-re)</th></tr>
<tr><td>je</td><td>finis</td><td>pars</td><td>attends</td></tr>
<tr><td>tu</td><td>finis</td><td>pars</td><td>attends</td></tr>
<tr><td>il/elle</td><td>finit</td><td>part</td><td>attend</td></tr>
<tr><td>nous</td><td>fin<b>iss</b>ons</td><td>partons</td><td>attendons</td></tr>
<tr><td>vous</td><td>fin<b>iss</b>ez</td><td>partez</td><td>attendez</td></tr>
<tr><td>ils/elles</td><td>fin<b>iss</b>ent</td><td>partent</td><td>attendent</td></tr></table></div>
<ul><li>Like finir: choisir, réussir, grossir, maigrir, remplir.</li>
<li>Like partir: sortir, dormir (dors, dormons), sentir.</li>
<li>Like attendre: vendre, répondre, perdre, entendre, descendre.</li></ul>`,
ex:[['Nous ___ à 18 h.',['finissons','finons','finisons'],0,'Type 2 adds -iss- in the plural.'],
['Tu ___ quand ?',['pars','partes','part'],0,'partir: tu pars.'],
["J'___ le bus.",['attends','attend','attende'],0,"attendre: j'attends."],
['Ils ___ leur maison.',['vendent','vendrent','vendissent'],0,'vendre: ils vendent.'],
['Elle ___ bien.',['dort','dorme','dors'],0,'dormir: elle dort.'],
['Vous ___ un dessert ?',['choisissez','choisez','choisiez'],0,'choisir: vous choisissez.']],
s:[['o','Je réponds toujours à tes messages.','I always reply to your messages.'],['w','Les enfants ___ (sortir) à midi.','sortent','sortir, ils','ils sortent.']]},

/* 14 */ {lvl:'A1',title:'Reflexive verbs',sub:'se lever · s\'appeler · se coucher',body:`
<p>Reflexive verbs have an extra pronoun that matches the subject. Many describe daily routine.</p>
<div class="tw"><table class="gt"><tr><th>se lever · to get up</th></tr>
<tr><td>je <b>me</b> lève</td></tr><tr><td>tu <b>te</b> lèves</td></tr><tr><td>il / elle <b>se</b> lève</td></tr>
<tr><td>nous <b>nous</b> levons</td></tr><tr><td>vous <b>vous</b> levez</td></tr><tr><td>ils / elles <b>se</b> lèvent</td></tr></table></div>
<p>me, te, se → <b>m', t', s'</b> before a vowel: <span class="ex">je m'appelle, il s'habille</span>.</p>
<p>Negative: the pronoun stays next to the verb: <span class="ex">Je ne me lève pas tôt.</span></p>
<div class="tip">With an infinitive the pronoun changes with the person: <i>Je vais me coucher. Tu vas te coucher.</i></div>`,
ex:[['Je ___ lève à 7 h.',['me','se','te'],0,'je → me.'],
['Comment tu ___ appelles ?',["t'",'te','se'],0,"te → t' before a vowel."],
['Nous ___ couchons tard.',['nous','se','vous'],0,'nous → nous.'],
['Elle ___ habille vite.',["s'",'se','me'],0,"se → s' before a vowel."],
['Je ne ___ réveille pas facilement.',['me','pas','se'],0,'ne + pronoun + verb + pas.'],
['Tu vas ___ reposer ce soir ?',['te','se','me'],0,'With an infinitive, the pronoun matches tu.']],
s:[['o','Je me brosse les dents après le repas.','I brush my teeth after the meal.'],['w','Vous ___ promenez souvent ?','vous','pronoun for vous','vous vous promenez.']]},

/* 15 */ {lvl:'A1+',title:'The imperative',sub:'Viens ! Allons-y ! Asseyez-vous.',body:`
<p>Use the present tense of <b>tu, nous, vous</b> without the subject.</p>
<div class="tw"><table class="gt"><tr><th></th><th>parler</th><th>finir</th><th>aller</th></tr>
<tr><td>tu</td><td>parl<b>e</b> !</td><td>finis !</td><td>va !</td></tr>
<tr><td>nous</td><td>parlons !</td><td>finissons !</td><td>allons !</td></tr>
<tr><td>vous</td><td>parlez !</td><td>finissez !</td><td>allez !</td></tr></table></div>
<ul><li>-er verbs (and aller) drop the -s for tu: <i>Regarde ! Écoute ! Va !</i></li>
<li>Irregular: être → <b>sois, soyons, soyez</b> · avoir → <b>aie, ayons, ayez</b> · savoir → <b>sache, sachez</b></li>
<li>Pronouns follow in the affirmative, with a hyphen: <span class="ex">Lève-toi ! Dis-moi. Prends-le.</span></li>
<li>In the negative they go before: <span class="ex">Ne te lève pas. Ne le prends pas.</span></li></ul>`,
ex:[['___ la porte, s\'il te plaît. (fermer, tu)',['Ferme','Fermes','Fermez'],0,'-er verbs drop the -s for tu.'],
['___ patients ! (être, vous)',['Soyez','Êtes','Soyons'],0,'être → soyez.'],
['___ -toi ! (s\'asseoir, tu)',['Assieds','Assois','Asseyez'],0,'Assieds-toi = sit down.'],
['Ne ___ inquiète pas !',['t\'','te','toi'],0,'Negative: pronoun before the verb.'],
['___ au cinéma ce soir ! (aller, nous)',['Allons','Allez','Va'],0,"Let's go: allons."],
['Dis-___ la vérité.',['moi','me','je'],0,'Affirmative: me → moi after the verb.']],
s:[['o',"Ne parle pas si vite, s'il te plaît.","Don't speak so fast, please."],['w','___ ton manteau, il fait froid ! (prendre, tu)','Prends','prendre, tu','tu prends → Prends !']]},

/* 16 */ {lvl:'A1+',title:'Stressed pronouns',sub:'moi · toi · lui · elle · nous · vous · eux · elles',body:`
<p>Use the stressed form when the pronoun stands alone or after a preposition.</p>
<div class="tw"><table class="gt"><tr><th>subject</th><th>stressed</th><th>example</th></tr>
<tr><td>je</td><td><b>moi</b></td><td>Moi, j'aime le thé.</td></tr>
<tr><td>tu</td><td><b>toi</b></td><td>Et toi ?</td></tr>
<tr><td>il / elle</td><td><b>lui / elle</b></td><td>Je pense à lui.</td></tr>
<tr><td>nous / vous</td><td><b>nous / vous</b></td><td>chez nous</td></tr>
<tr><td>ils / elles</td><td><b>eux / elles</b></td><td>avec eux</td></tr></table></div>
<ul><li>For emphasis: <span class="ex">Moi, je reste.</span></li>
<li>After prepositions: avec moi, sans toi, pour elle, chez eux.</li>
<li>Short answers: <span class="ex">Moi aussi. Moi non plus. C'est lui.</span></li></ul>`,
ex:[["J'adore le cinéma. — ___ aussi !",['Moi','Je','Me'],0,'Short answer: moi aussi.'],
['Tu viens avec ___ ? (us)',['nous','on','notre'],0,'After a preposition: nous.'],
['Ce cadeau est pour ___. (her)',['elle','la','lui'],0,'After pour: elle.'],
['Ils dînent chez ___. (them, m)',['eux','ils','leur'],0,'chez eux.'],
["Qui a fait ça ? — C'est ___. (him)",['lui','il','le'],0,"C'est lui."],
["Je n'aime pas le café. — ___ non plus.",['Moi','Je','Me'],0,'Moi non plus = me neither.']],
s:[['o','Vous voulez venir avec moi ?','Do you want to come with me?'],['w',"C'est ___ qui as raison. (you, tu)",'toi','stressed form of tu',"C'est toi."]]},

/* 17 */ {lvl:'A1+',title:'Near future & recent past',sub:'aller + infinitive · venir de',body:`
<p>The everyday way to talk about the future: <b>aller</b> in the present + infinitive.</p>
<p class="ex">Je vais manger. · Nous allons partir demain.</p>
<p>The negative wraps around aller: <span class="ex">Je ne vais pas sortir.</span></p>
<p>For something that has just happened: <b>venir de</b> + infinitive.</p>
<p class="ex">Je viens de manger = I have just eaten.</p>
<div class="tip">For an action in progress: <b>être en train de</b> + infinitive. <i>Je suis en train de lire</i> = I am reading (right now).</div>`,
ex:[['Demain, nous ___ visiter le musée.',['allons','venons','sommes'],0,'Near future: aller + infinitive.'],
['Il est fatigué : il ___ de courir.',['vient','va','est'],0,'He has just run: venir de.'],
['Je ne ___ pas sortir ce soir.',['vais','viens','suis'],0,'Negation goes around aller.'],
['Tu ___ partir quand ?',['vas','viens','es'],0,'tu vas + infinitive.'],
['I have just eaten = Je ___ de manger.',['viens','vais','suis'],0,'venir de = to have just.'],
['Je suis en train ___ lire.',['de','à','pour'],0,'être en train de.']],
s:[['o','Nous allons voyager en Espagne cet été.','We are going to travel to Spain this summer.'],['w','Le film ___ de commencer. (has just)','vient','venir, il','il vient de.']]},

/* 18 */ {lvl:'A2',title:'Passé composé with avoir',sub:"j'ai mangé · tu as vu · ils ont fait",body:`
<p>The main past tense for completed actions: <b>avoir</b> in the present + past participle.</p>
<div class="tw"><table class="gt"><tr><th>infinitive</th><th>participle</th><th>infinitive</th><th>participle</th></tr>
<tr><td>parler</td><td><b>parlé</b></td><td>faire</td><td><b>fait</b></td></tr>
<tr><td>finir</td><td><b>fini</b></td><td>prendre</td><td><b>pris</b></td></tr>
<tr><td>attendre</td><td><b>attendu</b></td><td>mettre</td><td><b>mis</b></td></tr>
<tr><td>être</td><td><b>été</b></td><td>voir</td><td><b>vu</b></td></tr>
<tr><td>avoir</td><td><b>eu</b></td><td>boire / lire</td><td><b>bu / lu</b></td></tr>
<tr><td>pouvoir / vouloir</td><td><b>pu / voulu</b></td><td>dire / écrire</td><td><b>dit / écrit</b></td></tr></table></div>
<p>Negative around the auxiliary: <span class="ex">Je n'ai pas compris.</span> Adverbs like <i>déjà, bien, beaucoup</i> also go between: <span class="ex">J'ai bien dormi.</span></p>
<div class="tip">One French past = several English ones: <i>J'ai mangé</i> = I ate / I have eaten.</div>`,
ex:[["Hier, j'___ mangé une pizza.",['ai','suis','as'],0,'manger takes avoir.'],
['Nous avons ___ un film.',['vu','voi','voyé'],0,'voir → vu.'],
['Tu as ___ tes devoirs ?',['fait','faisé','faire'],0,'faire → fait.'],
['Ils ont ___ le train.',['pris','prendu','prit'],0,'prendre → pris.'],
["Je n'ai ___ compris.",['pas','rien pas','ne'],0,"ne + avoir + pas + participle."],
['Elle a ___ une lettre.',['écrit','écrivé','écrite'],0,'écrire → écrit.']],
s:[['o',"Nous avons attendu le bus pendant une heure.","We waited for the bus for an hour."],['w',"J'ai ___ (boire) un café ce matin.",'bu','boire','boire → bu.']]},

/* 19 */ {lvl:'A2',title:'Passé composé with être',sub:'je suis allé · elle est partie',body:`
<p>About twenty verbs of movement or change of state, plus all reflexive verbs, take <b>être</b>.</p>
<div class="tw"><table class="gt"><tr><th>verb</th><th>participle</th><th>verb</th><th>participle</th></tr>
<tr><td>aller / venir</td><td>allé / venu</td><td>naître / mourir</td><td>né / mort</td></tr>
<tr><td>arriver / partir</td><td>arrivé / parti</td><td>rester / tomber</td><td>resté / tombé</td></tr>
<tr><td>entrer / sortir</td><td>entré / sorti</td><td>devenir / revenir</td><td>devenu / revenu</td></tr>
<tr><td>monter / descendre</td><td>monté / descendu</td><td>retourner / rentrer</td><td>retourné / rentré</td></tr></table></div>
<p>With être, the participle <b>agrees with the subject</b>: +e feminine, +s plural.</p>
<p class="ex">Il est allé · Elle est allée · Ils sont allés · Elles sont allées</p>
<div class="tip">Reflexives too: <i>Je me suis levé(e). Nous nous sommes promenés.</i></div>`,
ex:[['Elle est ___ à Paris.',['allée','allé','allés'],0,'With être it agrees: allée.'],
['Ils ___ partis à 8 h.',['sont','ont','est'],0,'partir takes être.'],
['Je me ___ levé tôt.',['suis','ai','me'],0,'Reflexive verbs always take être.'],
['Marie et Sophie sont ___ hier.',['arrivées','arrivés','arrivé'],0,'Feminine plural: arrivées.'],
['Mon grand-père est ___ en 1950.',['né','naît','naissé'],0,'naître → né.'],
['Nous ___ restés à la maison.',['sommes','avons','sont'],0,'rester takes être.']],
s:[['o','Elle est tombée dans la rue.','She fell in the street.'],['w','Les enfants sont ___ (sortir) jouer.','sortis','plural masculine','sortir → sortis.']]},

/* 20 */ {lvl:'A2',title:'Object pronouns',sub:'le · la · les · lui · leur',body:`
<div class="tw"><table class="gt"><tr><th></th><th>direct (it, him, her)</th><th>indirect (to him, to her)</th></tr>
<tr><td>me / you</td><td>me / te</td><td>me / te</td></tr>
<tr><td>him / it (m)</td><td><b>le</b> (l')</td><td rowspan="2"><b>lui</b></td></tr>
<tr><td>her / it (f)</td><td><b>la</b> (l')</td></tr>
<tr><td>us / you</td><td>nous / vous</td><td>nous / vous</td></tr>
<tr><td>them</td><td><b>les</b></td><td><b>leur</b></td></tr></table></div>
<p>The pronoun goes <b>before the conjugated verb</b>: <span class="ex">Je le vois.</span> With an infinitive, before the infinitive: <span class="ex">Je vais le voir.</span> In the passé composé, before the auxiliary: <span class="ex">Je l'ai vu.</span></p>
<div class="tip">Indirect = verbs with <b>à</b>: parler à, téléphoner à, donner à, dire à, écrire à. <i>Je téléphone à Paul → Je lui téléphone.</i></div>`,
ex:[['Tu vois Marie ? — Oui, je ___ vois.',['la','le','lui'],0,'Direct object, feminine: la.'],
['Tu parles à Paul ? — Oui, je ___ parle.',['lui','le','leur'],0,'parler à → indirect singular: lui.'],
['Tu aimes ces films ? — Oui, je ___ aime.',['les','leur','la'],0,'Direct plural: les.'],
['Je téléphone à mes parents → Je ___ téléphone.',['leur','les','lui'],0,'téléphoner à + plural: leur.'],
["Le livre ? Je vais ___ acheter.",['le','lui','en'],0,'Direct masculine, before the infinitive.'],
["Ta clé ? Je ___ ai trouvée.",["l'",'la','lui'],0,"Before a vowel: l'."]],
s:[['o','Je ne la connais pas très bien.',"I don't know her very well."],['w',"Tu as écrit à ta mère ? — Oui, je ___ ai écrit.",'lui','écrire à + one person','Indirect singular: lui.']]},

/* 21 */ {lvl:'A2',title:'Y and en',sub:"j'y vais · j'en veux deux",body:`
<p><b>y</b> replaces a place, or a thing after <b>à</b>:</p>
<p class="ex">Tu vas à Paris ? — Oui, j'y vais. · Tu penses à ton examen ? — Oui, j'y pense.</p>
<p><b>en</b> replaces a quantity, or a thing after <b>de</b>:</p>
<p class="ex">Tu veux du pain ? — Oui, j'en veux. · Tu as des frères ? — J'en ai deux. · Il parle de son voyage ? — Oui, il en parle.</p>
<ul><li>Same position as other pronouns: before the verb, before the infinitive, before the auxiliary.</li>
<li>Fixed expressions: <i>Il y a</i>, <i>Allons-y !</i>, <i>Je m'en vais</i> (I'm off), <i>J'en ai marre</i> (I'm fed up).</li></ul>`,
ex:[["Tu vas à la plage ? — Oui, j'___ vais.",['y','en','la'],0,'Place: y.'],
["Tu veux du café ? — Oui, j'___ veux.",['en','y','le'],0,'Quantity with du: en.'],
["Combien d'enfants as-tu ? — J'___ ai trois.",['en','y','les'],0,'Number + en.'],
["Tu penses à tes vacances ? — Oui, j'___ pense.",['y','en','lui'],0,'penser à + thing: y.'],
['Il parle de son travail ? — Oui, il ___ parle.',['en','y','lui'],0,'parler de + thing: en.'],
["Tu es allé au musée ? — Oui, j'___ suis allé.",['y','en','le'],0,'Place, before the auxiliary.']],
s:[['o',"Nous y allons tous les étés.","We go there every summer."],['w',"Des pommes ? J'___ ai acheté un kilo.",'en','quantity','Quantity: en.']]},

/* 22 */ {lvl:'A2',title:'The imparfait',sub:'je faisais · il était · nous avions',body:`
<p>The imparfait describes the past: background, habits, states, how things used to be.</p>
<p><b>Formation</b>: take the <i>nous</i> form of the present, drop -ons, add the endings.</p>
<div class="tw"><table class="gt"><tr><th></th><th>ending</th><th>parler (nous parl-ons)</th><th>faire (nous fais-ons)</th></tr>
<tr><td>je</td><td>-ais</td><td>parlais</td><td>faisais</td></tr>
<tr><td>tu</td><td>-ais</td><td>parlais</td><td>faisais</td></tr>
<tr><td>il/elle</td><td>-ait</td><td>parlait</td><td>faisait</td></tr>
<tr><td>nous</td><td>-ions</td><td>parlions</td><td>faisions</td></tr>
<tr><td>vous</td><td>-iez</td><td>parliez</td><td>faisiez</td></tr>
<tr><td>ils/elles</td><td>-aient</td><td>parlaient</td><td>faisaient</td></tr></table></div>
<p>The only irregular stem: <b>être → ét-</b> (j'étais, c'était).</p>
<div class="tip">English equivalents: "used to", "was …ing", or a simple past describing a state. <i>Quand j'étais petit, je jouais au foot</i> = When I was little, I used to play football.</div>`,
ex:[["Quand j'___ petit, j'habitais à Lyon.",['étais','étaisais','suis'],0,'être → j\'étais.'],
['Nous ___ souvent à la plage.',['allions','allons','allaient'],0,'nous → -ions.'],
['Il ___ beau ce jour-là.',['faisait','fait','faissait'],0,'faire → il faisait.'],
['Avant, ils ___ beaucoup.',['lisaient','lisiont','lisent'],0,'lire (nous lisons) → ils lisaient.'],
["C'___ génial !",['était','étais','été'],0,"c'était = it was."],
['Vous ___ un chien ?',['aviez','avez','avaient'],0,'avoir (nous avons) → vous aviez.']],
s:[['o','Le samedi, nous mangions chez ma grand-mère.','On Saturdays we used to eat at my grandmother\'s.'],['w','Quand il ___ (pleuvoir), je restais à la maison.','pleuvait','pleuvoir, il','il pleut → il pleuvait.']]},

/* 23 */ {lvl:'A2',title:'Imparfait or passé composé?',sub:'background vs. events',body:`
<p>Most past stories mix both tenses. Ask: is it a <b>scene</b> or an <b>event</b>?</p>
<div class="tw"><table class="gt"><tr><th>imparfait</th><th>passé composé</th></tr>
<tr><td>description, background, weather</td><td>a completed action</td></tr>
<tr><td>habit, repetition (<i>tous les jours, souvent, d'habitude</i>)</td><td>a single event (<i>un jour, soudain, hier</i>)</td></tr>
<tr><td>an action in progress</td><td>the action that interrupts it</td></tr>
<tr><td>feelings and states</td><td>a sequence of events</td></tr></table></div>
<p class="ex">Il <b>pleuvait</b> et je <b>lisais</b> quand le téléphone <b>a sonné</b>.</p>
<p>= It was raining and I was reading when the phone rang.</p>
<div class="tip">Think of a film: the imparfait sets the scenery, the passé composé moves the story forward.</div>`,
ex:[['Je ___ quand tu as appelé.',['dormais','ai dormi','dors'],0,'In progress, interrupted: imparfait.'],
['Hier, nous ___ au restaurant.',['avons dîné','dînions','dînons'],0,'One completed event: passé composé.'],
['Quand j\'étais enfant, je ___ du piano.',['faisais','ai fait','fais'],0,'Childhood habit: imparfait.'],
['Soudain, elle ___.',['est tombée','tombait','tombe'],0,'Sudden event: passé composé.'],
['Il ___ froid et il neigeait.',['faisait','a fait','fait'],0,'Weather / background: imparfait.'],
['Ce matin, je ___ à 6 h et je suis parti.',['me suis levé','me levais','me lève'],0,'Sequence of events: passé composé.']],
s:[['o','Il faisait beau quand nous sommes arrivés.','The weather was nice when we arrived.'],['w',"Elle regardait la télé quand on ___ (frapper) à la porte.",'a frappé','event, passé composé','The interrupting event: a frappé.']]},

/* 24 */ {lvl:'A2',title:'The futur simple',sub:'je parlerai · tu feras · ils seront',body:`
<p>Used for plans, predictions and promises, especially in writing. Add the endings to the <b>infinitive</b> (drop the final -e of -re verbs).</p>
<div class="tw"><table class="gt"><tr><th></th><th>ending</th><th>parler</th><th>prendre</th></tr>
<tr><td>je</td><td>-ai</td><td>parler<b>ai</b></td><td>prendr<b>ai</b></td></tr>
<tr><td>tu</td><td>-as</td><td>parler<b>as</b></td><td>prendr<b>as</b></td></tr>
<tr><td>il/elle</td><td>-a</td><td>parler<b>a</b></td><td>prendr<b>a</b></td></tr>
<tr><td>nous</td><td>-ons</td><td>parler<b>ons</b></td><td>prendr<b>ons</b></td></tr>
<tr><td>vous</td><td>-ez</td><td>parler<b>ez</b></td><td>prendr<b>ez</b></td></tr>
<tr><td>ils/elles</td><td>-ont</td><td>parler<b>ont</b></td><td>prendr<b>ont</b></td></tr></table></div>
<p>Irregular stems (same endings): être → <b>ser-</b>, avoir → <b>aur-</b>, aller → <b>ir-</b>, faire → <b>fer-</b>, venir → <b>viendr-</b>, pouvoir → <b>pourr-</b>, vouloir → <b>voudr-</b>, voir → <b>verr-</b>, savoir → <b>saur-</b>, devoir → <b>devr-</b>.</p>
<div class="tip">After <i>quand</i> about the future, French uses the future: <i>Quand je serai riche…</i> = When I am rich…</div>`,
ex:[["L'année prochaine, j'___ en France.",['irai','allerai','vais'],0,'aller → ir-.'],
['Nous ___ contents de te voir.',['serons','aurons','sommes'],0,'être → ser-.'],
['Demain, il ___ beau.',['fera','faira','fait'],0,'faire → fer-.'],
['Tu ___ le temps ?',['auras','avras','as'],0,'avoir → aur-.'],
['Ils ___ le train de 8 h.',['prendront','prenderont','prennent'],0,'prendre → prendr-.'],
['Quand tu ___ 18 ans, tu pourras voter.',['auras','as','aurais'],0,'Future after quand.']],
s:[['o','Je te téléphonerai ce soir.','I will call you tonight.'],['w','Vous ___ (venir) à la fête ?','viendrez','venir → viendr-','vous viendrez.']]},

/* 25 */ {lvl:'A2',title:'The conditional',sub:'je voudrais · tu pourrais · si j\'avais…',body:`
<p>Future stem + imparfait endings (-ais, -ais, -ait, -ions, -iez, -aient).</p>
<div class="tw"><table class="gt"><tr><th>verb</th><th>je</th><th>use</th></tr>
<tr><td>vouloir</td><td>je <b>voudrais</b></td><td>polite request</td></tr>
<tr><td>pouvoir</td><td>tu <b>pourrais</b>…?</td><td>polite question</td></tr>
<tr><td>aimer</td><td>j'<b>aimerais</b></td><td>wish</td></tr>
<tr><td>devoir</td><td>tu <b>devrais</b></td><td>advice (should)</td></tr>
<tr><td>être / avoir / faire</td><td>je <b>serais</b> / j'<b>aurais</b> / je <b>ferais</b></td><td>hypothesis</td></tr></table></div>
<p><b>Hypotheses</b>: <i>si</i> + imparfait → conditional.</p>
<p class="ex">Si j'avais le temps, je voyagerais plus. = If I had the time, I would travel more.</p>
<div class="tip">Never put the conditional right after <i>si</i>: «si j'aurais» is a famous mistake. It's <i>si j'avais</i>.</div>`,
ex:[['Je ___ un café, s\'il vous plaît.',['voudrais','voulais','veux bien'],0,'Polite request: je voudrais.'],
['Tu ___ m\'aider ?',['pourrais','pouvais','pourras'],0,'Polite question: tu pourrais.'],
['Vous ___ dormir plus. (should)',['devriez','deviez','devrez'],0,'Advice: devriez.'],
["Si j'étais riche, j'___ une maison.",['achèterais','achèterai','achetais'],0,'si + imparfait → conditional.'],
['Si tu ___ le temps, tu viendrais ?',['avais','aurais','as'],0,'After si: imparfait.'],
["J'___ visiter le Japon.",['aimerais','aimerai','aimais'],0,"Wish: j'aimerais."]],
s:[['o',"Nous aimerions réserver une table pour deux.","We would like to book a table for two."],['w',"S'il faisait beau, on ___ (aller) à la plage.",'irait','aller → ir- + -ait','on irait.']]},

/* 26 */ {lvl:'A2',title:'Comparing',sub:'plus… que · aussi… que · le meilleur',body:`
<div class="tw"><table class="gt"><tr><th></th><th>structure</th><th>example</th></tr>
<tr><td>more</td><td><b>plus</b> + adj + <b>que</b></td><td>Paul est plus grand que Marc.</td></tr>
<tr><td>less</td><td><b>moins</b> + adj + <b>que</b></td><td>Le train est moins cher que l'avion.</td></tr>
<tr><td>as</td><td><b>aussi</b> + adj + <b>que</b></td><td>Elle est aussi drôle que sa sœur.</td></tr>
<tr><td>nouns</td><td><b>plus de / moins de / autant de</b></td><td>J'ai plus de temps que toi.</td></tr></table></div>
<p><b>Superlative</b>: le/la/les + plus/moins + adjective: <span class="ex">C'est la ville la plus belle du monde.</span> Note <b>de</b> = "in": du monde, de la classe.</p>
<div class="tip">Irregular: bon → <b>meilleur</b> (better), le meilleur (the best) · bien → <b>mieux</b>, le mieux. Never «plus bon».</div>`,
ex:[['Le TGV est ___ rapide ___ la voiture.',['plus / que','plus / de','aussi / de'],0,'plus + adj + que.'],
['Ce gâteau est ___ que l\'autre. (better)',['meilleur','plus bon','mieux'],0,'bon → meilleur.'],
['Elle chante ___ que moi. (better)',['mieux','meilleur','plus bien'],0,'bien → mieux (adverb).'],
["C'est le restaurant le plus cher ___ la ville.",['de','que','dans'],0,'Superlative + de.'],
["J'ai ___ livres que toi. (as many)",['autant de','aussi','autant'],0,'With nouns: autant de.'],
['Paris est ___ grand que Londres. (less)',['moins','plus','aussi de'],0,'moins + adj + que.']],
s:[['o','Mon frère est plus âgé que moi.','My brother is older than me.'],['w',"C'est le ___ film de l'année ! (best)",'meilleur','bon, superlative','le meilleur.']]},

/* 27 */ {lvl:'A2',title:'Relative pronouns',sub:'qui · que · où',body:`
<p>Relative pronouns join two sentences.</p>
<div class="tw"><table class="gt"><tr><th>pronoun</th><th>replaces</th><th>example</th></tr>
<tr><td><b>qui</b></td><td>the subject (followed by a verb)</td><td>J'ai un ami <b>qui</b> habite à Nice.</td></tr>
<tr><td><b>que / qu'</b></td><td>the object (followed by a subject)</td><td>Le livre <b>que</b> je lis est super.</td></tr>
<tr><td><b>où</b></td><td>a place or a time</td><td>La ville <b>où</b> je suis né. · Le jour <b>où</b> on s'est rencontrés.</td></tr></table></div>
<p>Trick: if a verb comes straight after, use <b>qui</b>; if a subject (je, il, Marie…) comes after, use <b>que</b>.</p>
<div class="tip"><i>qui</i> never elides; <i>que</i> becomes <i>qu'</i> before a vowel: <i>le film qu'il a vu</i>.</div>`,
ex:[["C'est l'homme ___ travaille avec moi.",['qui','que','où'],0,'A verb follows: qui.'],
['La robe ___ tu portes est jolie.',['que','qui','où'],0,'A subject follows: que.'],
["C'est le restaurant ___ nous avons dîné.",['où','que','qui'],0,'A place: où.'],
['Le film ___ il a vu est nul.',["qu'",'qui','où'],0,"que → qu' before a vowel."],
["J'ai une amie ___ parle cinq langues.",['qui','que','où'],0,'A verb follows: qui.'],
["Je me souviens du jour ___ tu es arrivé.",['où','que','qui'],0,'Time: où.']],
s:[['o',"Voici la maison où j'ai grandi.","Here is the house where I grew up."],['w',"Les gens ___ j'ai rencontrés étaient sympas.",'que','object, subject follows','A subject (je) follows: que.']]},

/* 28 */ {lvl:'A2',title:'Time expressions',sub:'depuis · pendant · il y a · dans · en',body:`
<div class="tw"><table class="gt"><tr><th>word</th><th>meaning</th><th>example</th></tr>
<tr><td><b>depuis</b> + present</td><td>for / since (still true)</td><td>J'habite ici depuis trois ans.</td></tr>
<tr><td><b>pendant</b></td><td>for / during (finished duration)</td><td>J'ai dormi pendant dix heures.</td></tr>
<tr><td><b>il y a</b></td><td>ago</td><td>Je suis arrivé il y a une semaine.</td></tr>
<tr><td><b>dans</b></td><td>in (from now)</td><td>Le train part dans cinq minutes.</td></tr>
<tr><td><b>en</b></td><td>in (time taken)</td><td>J'ai lu le livre en deux jours.</td></tr></table></div>
<div class="tip">English uses the present perfect for <i>depuis</i>, French uses the <b>present</b>: <i>I have lived here for 3 years</i> = <i>J'habite ici depuis 3 ans</i>.</div>`,
ex:[["J'apprends le français ___ six mois.",['depuis','pendant','il y a'],0,'Still learning: depuis + present.'],
['Nous avons voyagé ___ deux semaines.',['pendant','depuis','dans'],0,'Finished duration: pendant.'],
["Elle est partie ___ une heure. (ago)",['il y a','dans','depuis'],0,'Ago: il y a.'],
['Le film commence ___ dix minutes.',['dans','il y a','en'],0,'From now: dans.'],
["Il a fini le travail ___ une heure. (it took him)",['en','dans','depuis'],0,'Time taken: en.'],
['___ combien de temps tu habites ici ?',['Depuis','Pendant','Il y a'],0,'Ongoing: depuis.']],
s:[['o',"Je travaille dans cette entreprise depuis 2020.","I have worked at this company since 2020."],['w',"Nous partons en vacances ___ trois jours. (in three days' time)",'dans','from now','From now: dans.']]},

/* 29 */ {lvl:'A2',title:'Savoir, connaître, pouvoir',sub:'three ways to "know" and "can"',body:`
<div class="tw"><table class="gt"><tr><th>verb</th><th>use</th><th>example</th></tr>
<tr><td><b>savoir</b></td><td>a fact, information</td><td>Je sais où il habite.</td></tr>
<tr><td><b>savoir</b> + infinitive</td><td>a skill you learned</td><td>Elle sait nager.</td></tr>
<tr><td><b>connaître</b></td><td>a person, place, thing (familiarity)</td><td>Je connais Paris. Tu connais Marc ?</td></tr>
<tr><td><b>pouvoir</b></td><td>to be able / allowed</td><td>Je ne peux pas venir, je travaille.</td></tr></table></div>
<p>savoir: sais, sais, sait, savons, savez, savent · connaître: connais, connais, connaît, connaissons, connaissez, connaissent.</p>
<div class="tip"><i>savoir</i> is followed by a clause or infinitive (que, où, si, comment…); <i>connaître</i> by a noun.</div>`,
ex:[['Tu ___ mon frère ?',['connais','sais','peux'],0,'A person: connaître.'],
['Je ne ___ pas où est la gare.',['sais','connais','peux'],0,'Information: savoir.'],
['Elle ___ jouer du piano.',['sait','connaît','peut'],0,'Learned skill: savoir.'],
['Nous ___ bien ce quartier.',['connaissons','savons','pouvons'],0,'A place: connaître.'],
["Désolé, je ne ___ pas venir ce soir.",['peux','sais','connais'],0,'Not able: pouvoir.'],
['Vous ___ à quelle heure ferme le magasin ?',['savez','connaissez','pouvez'],0,'Information: savoir.']],
s:[['o','Je ne sais pas conduire.',"I can't drive."],['w','Tu ___ un bon restaurant ici ?','connais','a place, tu','connaître: tu connais.']]},

/* 30 */ {lvl:'A2',title:'Adverbs & more negatives',sub:'-ment · ne… que · ne… aucun · ni… ni',body:`
<p><b>Adverbs in -ment</b>: add -ment to the feminine adjective: <span class="ex">lente → lentement, heureuse → heureusement</span>. Adjectives ending in a vowel use the masculine: <i>vrai → vraiment</i>. -ant/-ent → <b>-amment / -emment</b>: <i>courant → couramment, évident → évidemment</i>.</p>
<div class="tw"><table class="gt"><tr><th>negative</th><th>meaning</th><th>example</th></tr>
<tr><td>ne… que</td><td>only</td><td>Je n'ai que dix euros.</td></tr>
<tr><td>ne… aucun(e)</td><td>not a single</td><td>Il n'a aucune idée.</td></tr>
<tr><td>ne… ni… ni</td><td>neither… nor</td><td>Je ne bois ni thé ni café.</td></tr>
<tr><td>ne… pas encore</td><td>not yet</td><td>Il n'est pas encore arrivé.</td></tr>
<tr><td>personne ne / rien ne</td><td>nobody / nothing (as subject)</td><td>Personne n'est venu. Rien ne marche.</td></tr></table></div>
<div class="tip"><i>ne… que</i> is not really negative: it means "only". <i>Je ne mange que des légumes</i> = I only eat vegetables.</div>`,
ex:[['lent → ___',['lentement','lentment','lenterment'],0,'Feminine (lente) + -ment.'],
['évident → ___',['évidemment','évidentment','évidement'],0,'-ent → -emment.'],
["Il ___ a que deux euros. (only)",["n'",'ne','pas'],0,'ne… que = only.'],
["Je n'ai ___ idée.",['aucune','aucun','rien'],0,'idée is feminine: aucune.'],
['Elle ne mange ___ viande ni poisson.',['ni','pas','que'],0,'ne… ni… ni.'],
['___ n\'est venu à la réunion.',['Personne','Rien','Aucun'],0,'Nobody as subject: personne ne.']],
s:[['o',"Je ne parle que deux langues.","I only speak two languages."],['w','Elle parle ___ (couramment / courant) anglais.','couramment','adverb of courant','-ant → -amment.']]},

/* 31 */ {lvl:'A1+',title:'Expressing quantity',sub:'beaucoup de · un peu de · un kilo de',body:`
<p>After a word of quantity, use <b>de / d'</b> alone, without the article.</p>
<div class="tw"><table class="gt"><tr><th>expression</th><th>example</th></tr>
<tr><td>beaucoup de</td><td>beaucoup de travail, beaucoup d'amis</td></tr>
<tr><td>un peu de</td><td>un peu de sucre</td></tr>
<tr><td>peu de</td><td>peu de temps</td></tr>
<tr><td>assez de · trop de</td><td>assez d'argent, trop de bruit</td></tr>
<tr><td>combien de</td><td>Combien de frères as-tu ?</td></tr>
<tr><td>un kilo de · une bouteille de · un paquet de</td><td>un kilo de pommes, une bouteille d'eau</td></tr></table></div>
<p>Compare: <span class="ex">Je mange <b>des</b> pommes</span> but <span class="ex">Je mange <b>beaucoup de</b> pommes</span>.</p>
<div class="tip"><i>la plupart des</i> and <i>bien des</i> keep the article: <i>la plupart des gens</i> = most people.</div>`,
ex:[["J'ai beaucoup ___ travail.",['de','du','des'],0,'After beaucoup: de.'],
['Il y a trop ___ voitures.',['de','des','les'],0,'After trop: de.'],
['Je voudrais un kilo ___ tomates.',['de','des','du'],0,'After a measure: de.'],
["Tu as assez ___ argent ?",["d'",'de l\'','des'],0,"Before a vowel: d'."],
['___ de personnes viennent ?',['Combien','Comment','Quel'],0,'How many: combien de.'],
['La plupart ___ étudiants sont là.',['des','de','les'],0,'la plupart des keeps the article.']],
s:[['o',"Il y a un peu de lait dans le frigo.","There's a little milk in the fridge."],['w',"Achète une bouteille ___ eau, s'il te plaît.","d'",'before a vowel',"Measure + d' before a vowel."]]}
];
/* which grammar lessons appear at the end of each vocabulary unit */
const UNIT_G = [[0,3],[7,12],[2,4],[1,14],[8,31],[10,11],[5,6,13],[9,16,26],[15,17],[18,19],[20,21],[22,23],[27,30],[24,28],[25,29]];


/* ---------- data ---------- */
const UNITS=[], WORDS=[];
(function parse(){let u=null,l=null;
  VOCAB.trim().split('\n').forEach(raw=>{const line=raw.trim(); if(!line) return;
    if(line.startsWith('## ')){const [t,s]=line.slice(3).split('|'); u={title:t,sub:s||'',lessons:[]}; UNITS.push(u);}
    else if(line.startsWith('# ')){l={title:line.slice(2),words:[]}; u.lessons.push(l);}
    else {const i=line.indexOf(';'); const w={id:WORDS.length,fr:line.slice(0,i).trim(),it:line.slice(i+1).trim(),u:UNITS.length-1,lt:l.title}; l.words.push(w); WORDS.push(w);}
  });})();
const NODES=[];
UNITS.forEach((u,ui)=>{u.nodes=[];
  u.lessons.forEach((l,li)=>{const n=l.words.length,parts=n>14?2:1,size=Math.ceil(n/parts);
    for(let p=0;p<parts;p++){const node={id:`v${ui}.${li}.${p}`,kind:'v',title:l.title,part:parts>1?p+1:0,words:l.words.slice(p*size,(p+1)*size),unit:ui,idx:NODES.length};NODES.push(node);u.nodes.push(node);}
  });
  (UNIT_G[ui]||[]).forEach(g=>{const node={id:'g'+g,kind:'g',g,title:GR[g].title,unit:ui,idx:NODES.length};NODES.push(node);u.nodes.push(node);});
});

/* ---------- state ---------- */
const KEY='millemots.v1';
const DEF={v:2,xp:0,days:{},streak:0,best:0,last:null,done:{},words:{},gram:{},sound:true,free:false,goal:50,lessons:0,perfect:0};
const fresh=()=>Object.assign({},DEF,{days:{},done:{},words:{},gram:{}});
let S; try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const dd=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const DAY=864e5,INT=[0,1,2,4,8,16];
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){localSave();}
function checkStreak(){if(S.last&&dd(S.last,today())>1&&S.streak){S.streak=0;}}
checkStreak();
const rec=w=>S.words[w.fr];
const learned=()=>WORDS.filter(w=>(rec(w)||{}).b>=2).length;
const seenN=()=>WORDS.filter(w=>rec(w)).length;
function grade(w,ok){const r=S.words[w.fr]||{b:0,d:0,ok:0,ko:0};if(ok){r.b=Math.min(5,r.b+1);r.ok++}else{r.b=0;r.ko++}r.d=Date.now()+INT[r.b]*DAY;S.words[w.fr]=r;}
function level(){const L=learned(),G=Object.keys(S.gram).length;const p=Math.min(1,(L/WORDS.length)*.7+(G/GR.length)*.3);
  const st=[[0,'Pre-A1'],[.12,'A1'],[.35,'A1+'],[.6,'A2−'],[.85,'A2']];return{p,lab:st.filter(s=>p>=s[0]).pop()[1],L,G};}
const unlocked=n=>S.free||n.idx===0||!!S.done[NODES[n.idx-1].id];
const curNode=()=>NODES.find(n=>!S.done[n.id]&&unlocked(n));
const dueWords=()=>WORDS.filter(w=>{const r=rec(w);return r&&r.d<=Date.now()});

/* ---------- local storage & backup ---------- */
let PERSIST=null;
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{PERSIST=p;if(VIEW==='profile'&&!SS)render();}).catch(()=>{});}}catch(e){}
function mergeState(a,b){const r=Object.assign(fresh(),a);
  const mx=(x,y)=>Math.max(x||0,y||0);
  r.days=Object.assign({},a.days);for(const k in (b.days||{}))r.days[k]=mx(r.days[k],b.days[k]);
  r.done=Object.assign({},a.done);for(const k in (b.done||{}))r.done[k]={stars:mx((r.done[k]||{}).stars,b.done[k].stars)};
  r.gram=Object.assign({},a.gram);for(const k in (b.gram||{}))r.gram[k]={stars:mx((r.gram[k]||{}).stars,b.gram[k].stars)};
  r.words=Object.assign({},a.words);for(const k in (b.words||{})){const x=r.words[k],y=b.words[k];
    if(!x){r.words[k]=y;continue;}const nx=(x.ok||0)+(x.ko||0),ny=(y.ok||0)+(y.ko||0);if(ny>nx||(ny===nx&&(y.d||0)>(x.d||0)))r.words[k]=y;}
  const daySum=Object.values(r.days).reduce((s,v)=>s+v,0);
  r.xp=Math.max(a.xp||0,b.xp||0,daySum);r.lessons=mx(a.lessons,b.lessons);r.perfect=mx(a.perfect,b.perfect);r.best=mx(a.best,b.best);
  const la=a.last||'',lb=b.last||'';if(lb>la){r.last=b.last;r.streak=b.streak||0;}else if(la===lb){r.streak=mx(a.streak,b.streak);}
  r.best=Math.max(r.best,r.streak);
  return r;}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const I={
 fire:'<svg class="ico" viewBox="0 0 24 24"><path d="M12.5 2c.6 3.6 4.9 5.9 4.9 11.1A5.4 5.4 0 0 1 12 18.5a5.4 5.4 0 0 1-5.4-5.4c0-2.3 1.1-3.9 2.3-5 .1 2 1 3.2 2.2 3.4-.3-3.3.2-6.4 1.4-9.5z"/><path d="M6 20h12v2H6z" opacity=".35"/></svg>',
 bolt:'<svg class="ico" viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg>',
 speak:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 9.5v5h4l5 4.5v-14L7 9.5zM15.5 8.2a5 5 0 0 1 0 7.6l-1.2-1.4a3.2 3.2 0 0 0 0-4.8zM18 5.5a8.7 8.7 0 0 1 0 13l-1.2-1.4a6.9 6.9 0 0 0 0-10.2z"/></svg>',
 check:'<svg class="ico" viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.8 1.8 6 6L20.7 8.6l-1.8-1.8z"/></svg>',
 lock:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.5v11h-13V10zm2 0h6V7.5a3 3 0 0 0-6 0z"/></svg>',
 book:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 4.5C6.5 3.5 9.3 3.6 12 5c2.7-1.4 5.5-1.5 8-.5V19c-2.5-1-5.3-.9-8 .5-2.7-1.4-5.5-1.5-8-.5zM11 6.6C9.4 5.9 7.7 5.7 6 6v10.6c1.7-.3 3.4-.1 5 .5z"/></svg>',
 star:'<svg class="ico" viewBox="0 0 24 24"><path d="m12 2.5 2.9 6.2 6.6.6-5 4.5 1.5 6.6L12 17l-6 3.4 1.5-6.6-5-4.5 6.6-.6z"/></svg>',
 x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>',
 play:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',
};
const stars=(n)=>`<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i=>`<span class="${i<n?'':'e'}">${I.star}</span>`).join('')}</span>`;

/* audio */
const HAS_TTS='speechSynthesis' in window;let FRV=null;
function loadV(){try{const v=speechSynthesis.getVoices();FRV=v.find(x=>/^fr[-_]FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null}catch(e){}}
if(HAS_TTS){loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}}
function speak(t){if(!HAS_TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\(.*?\)/g,'').replace(/\.\.\./g,' ').replace(/___/g,' ').trim());u.lang='fr-FR';if(FRV)u.voice=FRV;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let AC;function beep(ok){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;(ok?[660,990]:[240,190]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.09;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.2:.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.22)})}catch(e){}}

/* ---------- views ---------- */
const VIEWS=[['learn','./learn'],['review','./review'],['grammar','./grammar'],['words','./words'],['profile','./profile']];
let VIEW=(location.hash||'').slice(1); if(!VIEWS.some(v=>v[0]===VIEW)) VIEW='learn';
let GOPEN=null, WQ='', WU='all', RESETARM=false;
function go(v){VIEW=v;GOPEN=null;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}

function header(){
  return `<header class="top"><a class="brand" href="index.html"><span class="mark">m<i></i></span><span>mille mots<small>français · A1 → A2</small></span></a>
  <div class="chips"><span class="chip fire ${S.streak?'':'off'}" title="Day streak">${I.fire}${S.streak}</span><span class="chip xp" title="Total XP">${I.bolt}${S.xp}</span></div></header>
  <nav class="dots" aria-label="Sections">${VIEWS.map(([k,l])=>`<button data-act="go" data-v="${k}" class="${VIEW===k?'on':''}">${l}</button>`).join('')}</nav>`;}

function render(){
  const body={learn:vLearn,review:vReview,grammar:vGram,words:vWords,profile:vProfile}[VIEW]();
  $('#app').innerHTML=header()+body+`<footer class="foot-note">mille mots · ${WORDS.length} words · ${GR.length} grammar lessons · progress saved in this browser</footer>`;
}
function greeting(){const h=new Date().getHours();return h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';}
function wotd(){let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))>>>0;return WORDS[h%WORDS.length];}

function vLearn(){
  const cur=curNode(),tx=S.days[today()]||0,lv=level();
  const sub=cur?`Next up: <b>${esc(cur.title)}${cur.part?' · '+cur.part:''}</b> · unit ${cur.unit+1}`:'You finished the whole path. Keep your words alive with review.';
  let html=`<div class="card hero"><div style="min-width:0"><h1>${greeting()} !</h1><p class="muted">${sub}</p></div>
  ${cur?`<button class="btn btn-play" data-act="start" data-id="${cur.id}">${I.play} ${Object.keys(S.done).length?'Continue':'Start'}</button>`:`<button class="btn" data-act="go" data-v="review">Review</button>`}</div>
  <div class="strip">
    <div><span class="eyebrow">streak</span><b style="color:var(--gold)">${S.streak} ${S.streak===1?'day':'days'}</b></div>
    <div><span class="eyebrow">today</span><b>${tx}<span class="muted" style="font-size:15px;font-weight:600"> / ${S.goal} XP</span></b><span class="bar"><i style="width:${Math.min(100,tx/S.goal*100)}%"></i></span></div>
    <div><span class="eyebrow">to review</span><b>${dueWords().length}</b></div>
    <div><span class="eyebrow">level</span><b style="color:var(--blue)">${lv.lab}</b></div>
  </div>`;
  const offs=[0,48,72,48,0,-48,-72,-48];
  UNITS.forEach((u,ui)=>{const dn=u.nodes.filter(n=>S.done[n.id]).length;
    html+=`<div class="unit ${ui%2?'':'alt'}" id="u${ui}"><div class="uhead"><div style="min-width:0"><div class="eyebrow">./unit ${ui+1}</div><h2>${esc(u.title)}</h2><p>${esc(u.sub)}</p></div><span class="prog">${dn}/${u.nodes.length}</span></div><div class="track">`;
    u.nodes.forEach((n,k)=>{const d=S.done[n.id],ul=unlocked(n),isCur=cur&&cur.id===n.id;
      const cls=['node',n.kind==='g'?'g':'',d?'done':'',!ul?'lock':'',isCur?'cur':''].join(' ');
      const ic=!ul?I.lock:d?I.check:n.kind==='g'?I.book:I.star;
      html+=`<div class="nwrap" style="transform:translateX(${offs[k%8]}px)">${isCur?'<span class="bubble">START</span>':''}<button class="${cls}" data-act="node" data-id="${n.id}" aria-label="${esc(n.title)}">${ic}</button>
      <span class="nlabel">${esc(n.title)}${n.part?' · '+n.part:''}</span>${d?stars(d.stars):''}</div>`;});
    html+=`</div></div>`;});
  return html;
}

function vReview(){
  const due=dueWords(),seen=WORDS.filter(rec),cnt=[0,0,0,0,0,0];seen.forEach(w=>cnt[rec(w).b]++);
  const mx=Math.max(1,...cnt),lab=['now','1 d','2 d','4 d','8 d','16 d'];

/* ---------- sessions ---------- */
let SS=null;
function distract(w,field,n=3){const out=[],seen=new Set([w[field]]);
  const pool=shuffle(WORDS.filter(c=>c.u===w.u)).concat(shuffle(WORDS.slice()));
  for(const c of pool){if(out.length>=n)break;if(c.fr===w.fr||c.it===w.it||seen.has(c[field]))continue;seen.add(c[field]);out.push(c[field]);}return out;}
const typeable=w=>!w.fr.includes('...')&&w.fr.length<=22;
function mk(t,w){
  if(t==='listen'&&!HAS_TTS)t='mcif';
  if(t==='type'&&!typeable(w))t='mcif';
  if(t==='mcfi')return{t,w,ans:w.it,opts:shuffle([w.it,...distract(w,'it')])};
  if(t==='mcif'||t==='listen')return{t,w,ans:w.fr,opts:shuffle([w.fr,...distract(w,'fr')])};
  return{t:'type',w,ans:w.fr};}
function buildVocab(words){const ex=words.map(w=>({t:'flash',w}));const ts=['mcfi','mcif','listen','type'];
  const q=shuffle(words.slice()).map((w,i)=>mk(ts[i%4],w));
  q.splice(5,0,{t:'match',pairs:shuffle(words.slice()).slice(0,5)});
  shuffle(words.slice()).slice(0,3).forEach((w,i)=>q.push(mk(['type','mcfi','listen'][i],w)));
  return ex.concat(q);}
const tokens=s=>s.replace(/\s+([?!:;])/g,'$1').split(' ').map(t=>t.replace(/[.,!?;:]+$/,'')).filter(Boolean);
function buildGram(g){
  const mc=g.ex.map(([q,o,a,e])=>({t:'gmc',q,ans:o[a],opts:shuffle(o.slice()),exp:e}));
  const st=g.s.map(x=>x[0]==='o'?{t:'order',fr:x[1],en:x[2],tok:tokens(x[1]),bank:null}:{t:'gw',q:x[1],ans:x[2],hint:x[3],exp:x[4]});
  return shuffle(mc).concat(st);}
function buildReview(){let ws=dueWords();if(!ws.length)ws=WORDS.filter(rec).sort((a,b)=>rec(a).b-rec(b).b||rec(a).d-rec(b).d);
  ws=shuffle(ws.slice(0,15));const ts=['mcfi','type','mcif','listen'];return ws.map((w,i)=>mk(ts[i%4],w));}

function startSession(kind,ref){
  const ex=kind==='v'?buildVocab(ref.words):kind==='g'?buildGram(GR[ref]):buildReview();
  if(!ex.length)return;
  SS={kind,ref,ex,i:0,ok:0,ko:0,combo:0,maxc:0,xp:0,t0:Date.now(),answered:false,sel:null,rq:new Set(),match:null,last:null,placed:[]};
  closeSheet();let el=$('#sess');if(!el){el=document.createElement('div');el.id='sess';el.className='sess';document.body.appendChild(el);}
  document.body.style.overflow='hidden';renderSess();}
function endSession(){SS=null;const el=$('#sess');if(el)el.remove();document.body.style.overflow='';render();}
const cur=()=>SS&&SS.ex[SS.i];

function renderSess(){const e=cur(),el=$('#sess');const prog=SS.i/SS.ex.length*100;
  const fc=SS.answered?(SS.last.ok?'ok':'ko'):'';
  el.innerHTML=`<div class="sbar"><button class="iconbtn" style="background:none;color:var(--ink-3)" data-act="quit" aria-label="Quit">${I.x}</button><div class="pbar"><b style="width:${prog}%"></b></div></div>
  <div class="sbody"><div class="sinner">${exBody(e)}</div></div><div class="foot ${e.t==='match'?'':fc}" id="foot">${footHtml(e)}</div>`;
  if(!SS.answered){if(e.t==='listen')setTimeout(()=>speak(e.ans),250);if(e.t==='flash')setTimeout(()=>speak(e.w.fr),250);}
  const ti=$('#tin');if(ti&&!SS.answered)setTimeout(()=>ti.focus(),60);}

function exBody(e){
  if(e.t==='flash'){const r=rec(e.w);return `<div class="sechead"><h2>New word</h2><span class="tag ${r?'':'new'}">${r?'seen before':'new'}</span></div>
    <div class="flip" data-act="flip" id="flip"><div class="flip-in"><div class="face"><span class="w">${esc(e.w.fr)}</span><button class="iconbtn" data-act="speak" data-t="${esc(e.w.fr)}" aria-label="Listen">${I.speak}</button><span class="hint">tap to flip</span></div>

  if(e.t==='match'){if(!SS.match){SS.match={L:shuffle(e.pairs.slice()),R:shuffle(e.pairs.slice()),sl:null,sr:null,gone:new Set(),mis:0};}const m=SS.match;

  if(e.t==='order'){if(!e.bank)e.bank=shuffle(e.tok.map((t,i)=>({t,i})));const used=new Set(SS.placed);
    const cls=SS.answered?(SS.last.ok?'right':'wrong'):'';
    return `<h2>Write this in French</h2><div class="prompt"><span class="w" style="font-size:clamp(22px,5vw,28px)">${esc(e.en)}</span></div>
    <div class="slots">${SS.placed.map((bi,k)=>`<button class="tile ${cls}" data-act="unplace" data-k="${k}" ${SS.answered?'disabled':''}>${esc(e.bank[bi].t)}</button>`).join('')}</div>
    <div class="bank">${e.bank.map((b,bi)=>`<button class="tile ${used.has(bi)?'used':''}" data-act="place" data-i="${bi}" ${SS.answered||used.has(bi)?'disabled':''}>${esc(b.t)}</button>`).join('')}</div>`;}
  if(e.t==='gw'){const [a,b]=e.q.split('___');
    return `<h2>Fill in the gap</h2><div class="prompt"><span class="w" style="font-size:clamp(22px,5vw,30px)">${esc(a)}<input id="tin" class="tin inline" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(6,e.ans.length+2)}" aria-label="Missing word" ${SS.answered?'disabled':''} value="${SS.answered?esc(SS.typed||''):''}">${esc(b||'')}</span></div>
    <span class="hint">hint: ${esc(e.hint)}</span>
    <div class="accents">${'é è ê à â ç ô û î ë ï ù œ'.split(' ').map(c=>`<button data-act="acc" data-c="${c}" ${SS.answered?'disabled':''}>${c}</button>`).join('')}</div>`;}
  let head='';
  if(e.t==='mcfi')head=`<h2>What does this mean?</h2><div class="prompt"><button class="iconbtn" data-act="speak" data-t="${esc(e.w.fr)}" aria-label="Listen">${I.speak}</button><span class="w">${esc(e.w.fr)}</span></div>`;
  if(e.t==='mcif')head=`<h2>How do you say it in French?</h2><div class="prompt"><span class="w">${esc(e.w.it)}</span></div>`;
  if(e.t==='listen')head=`<h2>What do you hear?</h2><div class="prompt"><button class="iconbtn" style="width:72px;height:72px;font-size:32px;border-radius:22px" data-act="speak" data-t="${esc(e.ans)}" aria-label="Play again">${I.speak}</button><span class="muted">Tap to play again</span></div>`;
  if(e.t==='gmc')head=`<h2>Choose the right answer</h2><div class="prompt"><span class="w" style="font-size:clamp(22px,5vw,30px)">${esc(e.q)}</span></div>`;
  if(e.t==='type')return `<h2>Write it in French</h2><div class="prompt"><span class="w">${esc(e.w.it)}</span></div>
    <input id="tin" class="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="The article is optional" aria-label="Your answer" ${SS.answered?'disabled':''} value="${SS.answered?esc(SS.typed||''):''}">
    <div class="accents">${'é è ê à â ç ô û î ë ï ù œ'.split(' ').map(c=>`<button data-act="acc" data-c="${c}" ${SS.answered?'disabled':''}>${c}</button>`).join('')}</div>`;
  return head+`<div class="opts">${e.opts.map((o,i)=>{let c='';if(SS.answered){if(o===e.ans)c='right';else if(i===SS.sel)c='wrong';}else if(i===SS.sel)c='sel';
    return `<button class="opt ${c}" data-act="opt" data-i="${i}" ${SS.answered?'disabled':''}><kbd>${i+1}</kbd>${esc(o)}</button>`}).join('')}</div>`;}

function footHtml(e){
  if(e.t==='flash')return `<div class="fi"><button class="btn ghost" data-act="fagain">Still new to me</button><button class="btn" data-act="fknow">I know it</button></div>`;
  if(!SS.answered){if(e.t==='match')return `<div class="fi"><span class="muted">Tap a French word, then its meaning</span></div>`;
    const dis=(['type','gw'].includes(e.t))?'':e.t==='order'?(SS.placed.length?'':'disabled'):(SS.sel===null?'disabled':'');
    return `<div class="fi"><button class="btn block" data-act="check" id="checkbtn" ${dis}>Check</button></div>`;}
  const ok=SS.last.ok;let msg;
  if(e.t==='match')msg=SS.match.mis?`Done with ${SS.match.mis} ${SS.match.mis===1?'mistake':'mistakes'}.`:'All right on the first try.';
  else if(e.t==='order')msg=ok?esc(e.fr):`Correct answer: <b>${esc(e.fr)}</b>`;
  else if(ok)msg=SS.last.note||((e.t==='gmc'||e.t==='gw')?esc(e.exp):e.w?`${esc(e.w.fr)} = ${esc(e.w.it)}`:'');
  else msg=`Correct answer: <b>${esc(e.ans)}</b>${(e.t==='gmc'||e.t==='gw')?'<br>'+esc(e.exp):e.w&&e.t!=='mcfi'?' · '+esc(e.w.it):''}`;
  const t=ok?['Parfait !','Très bien !','Bravo !','Excellent !'][SS.ok%4]:'Not quite';
  return `<div class="fi"><div class="fb"><strong>${t}</strong>${msg}</div><button class="btn ${ok?'green':'red'}" data-act="next" id="nextbtn">Continue</button></div>`;}

const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[!?.,;:«»"]/g,'').replace(/\s+/g,' ').trim();
const noArt=s=>s.replace(/^(le |la |les |l'|un |une |des |du |de la )/,'');
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');
function check(){const e=cur();if(SS.answered)return;let ok,note='';
  if(e.t==='type'||e.t==='gw'){const v=($('#tin')||{}).value||'';if(!v.trim())return;SS.typed=v;
    const a=e.t==='type'?noArt(norm(v)):norm(v),b=e.t==='type'?noArt(norm(e.ans)):norm(e.ans);
    if(a===b)ok=true;else if(noAcc(a)===noAcc(b)){ok=true;note=`Watch the accents: <b>${esc(e.ans)}</b>`;}else ok=false;
    if(ok&&!note&&e.t==='type'&&norm(v)!==norm(e.ans))note=`Full form: <b>${esc(e.ans)}</b>`;
    if(ok&&!note&&e.t==='gw')note=esc(e.exp);}
  else if(e.t==='order'){if(!SS.placed.length)return;const got=SS.placed.map(bi=>e.bank[bi].t).join(' ');ok=norm(got)===norm(e.tok.join(' '));if(ok)speak(e.fr);}
  else{if(SS.sel===null)return;ok=e.opts[SS.sel]===e.ans;}
  settle(ok,note);}
function settle(ok,note){const e=cur();SS.answered=true;SS.last={ok,note};
  if(ok){SS.ok++;SS.combo++;SS.maxc=Math.max(SS.maxc,SS.combo);SS.xp+=10;if(SS.combo%5===0){SS.xp+=5;comboPop(SS.combo);}}
  else{SS.ko++;SS.combo=0;if(!SS.rq.has(e)){const c=Object.assign({},e);if(c.opts)c.opts=shuffle(c.opts.slice());if(c.t==='order')c.bank=null;SS.ex.push(c);SS.rq.add(c);}}
  if(e.w)grade(e.w,ok);
  if(e.t==='mcfi'&&ok)speak(e.w.fr);
  beep(ok);save();renderSess();}
function comboPop(n){const d=document.createElement('div');d.className='combo';d.textContent=n+' in a row · +5 XP';document.body.appendChild(d);setTimeout(()=>d.remove(),950);}
function next(){SS.i++;SS.answered=false;SS.sel=null;SS.match=null;SS.last=null;SS.placed=[];SS.typed='';
  if(SS.i>=SS.ex.length){finish();return;}renderSess();}

function bumpStreak(){const t=today();if(S.last===t)return;S.streak=(S.last&&dd(S.last,t)===1)?S.streak+1:1;S.last=t;S.best=Math.max(S.best,S.streak);}
function finish(){const tot=SS.ok+SS.ko,acc=tot?Math.round(SS.ok/tot*100):100,first=SS.ko===0;
  const before=BADGES.filter(b=>b[3]()).map(b=>b[1]);
  SS.xp+=15;if(first&&SS.kind!=='review')SS.xp+=10;
  S.xp+=SS.xp;S.days[today()]=(S.days[today()]||0)+SS.xp;S.lessons++;if(first&&SS.kind!=='review')S.perfect++;bumpStreak();
  const st=acc>=95?3:acc>=80?2:1;
  if(SS.kind==='v'){const p=S.done[SS.ref.id];S.done[SS.ref.id]={stars:Math.max(st,p?p.stars:0)};}
  if(SS.kind==='g'){const p=S.gram[SS.ref];S.gram[SS.ref]={stars:Math.max(st,p?p.stars:0)};S.done['g'+SS.ref]={stars:Math.max(st,(S.done['g'+SS.ref]||{}).stars||0)};}
  save();const nb=BADGES.filter(b=>b[3]()&&!before.includes(b[1]));
  const secs=Math.round((Date.now()-SS.t0)/1000),tm=Math.floor(secs/60)+':'+pad(secs%60);
  const title=SS.kind==='review'?'Review done':first?'Sans faute !':'Étape terminée !';
  $('#sess').innerHTML=`<div class="sbody"><div class="sinner result" style="padding-top:8vh"><span class="eyebrow">./${SS.kind==='review'?'review':SS.kind==='g'?'grammar':'vocabulary'}</span><h2>${title}</h2>${SS.kind!=='review'?`<div style="font-size:30px">${stars(st)}</div>`:''}
  <div class="rgrid"><div class="card" style="border-color:var(--gold)"><span class="eyebrow">xp</span><b style="color:var(--gold)">+${SS.xp}</b></div><div class="card" style="border-color:var(--green)"><span class="eyebrow">accuracy</span><b style="color:var(--green)">${acc}%</b></div><div class="card" style="border-color:var(--blue)"><span class="eyebrow">time</span><b style="color:var(--blue)">${tm}</b></div></div>
  <p class="muted" style="margin:0">Best run: ${SS.maxc} in a row · ${S.streak}-day streak</p>
  ${nb.map(b=>`<div class="card badge" style="flex-direction:row;gap:14px;text-align:left;width:100%"><span class="medal">${b[0]}</span><div><span class="eyebrow">new achievement</span><br><b>${b[1]}</b> · <small>${b[2]}</small></div></div>`).join('')}
  </div></div><div class="foot"><div class="fi"><button class="btn block" data-act="quit">Continue</button></div></div>`;
  confetti();}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const x=c.getContext('2d'),dpr=devicePixelRatio||1,W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cs=getComputedStyle(document.documentElement);
  const cols=['--blue','--red','--gold','--green'].map(v=>cs.getPropertyValue(v).trim()||'#888');
  const P=Array.from({length:110},()=>({x:W/2,y:H*.3,vx:(Math.random()-.5)*22*dpr,vy:(-Math.random()*18-6)*dpr,s:(Math.random()*5+4)*dpr,c:cols[Math.random()*4|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.55*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s,-p.s/2,p.s*2,p.s);x.restore()});if(++t<150)requestAnimationFrame(f);else c.remove()})();}

function matchTap(side,i){const m=SS.match,e=cur();if(side==='l')m.sl=i;else m.sr=i;
  if(m.sl!==null&&m.sr!==null){const a=m.L[m.sl],b=m.R[m.sr];
    if(a.id===b.id){m.gone.add(a.id);beep(true);speak(a.fr);m.sl=m.sr=null;
      if(m.gone.size===e.pairs.length){SS.answered=true;SS.last={ok:true};SS.ok++;SS.combo++;SS.maxc=Math.max(SS.maxc,SS.combo);SS.xp+=m.mis?10:15;e.pairs.forEach(w=>grade(w,true));save();}}
    else{m.mis++;beep(false);const L=m.sl,R=m.sr;m.sl=m.sr=null;renderSess();
      const cols=document.querySelectorAll('.match .col'),bl=cols[0]&&cols[0].children[L],br=cols[1]&&cols[1].children[R];[bl,br].forEach(b=>b&&b.classList.add('wrong'));setTimeout(()=>{[bl,br].forEach(b=>b&&b.classList.remove('wrong'))},450);return;}}
  renderSess();}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='closesheet'&&ev.target!==t)return;
  switch(a){
  case 'go':go(t.dataset.v);break;
  case 'node':openNode(NODES.find(x=>x.id===t.dataset.id));break;
  case 'closesheet':closeSheet();break;
  case 'start':{const n=NODES.find(x=>x.id===t.dataset.id);closeSheet();if(n.kind==='g'){VIEW='grammar';GOPEN=n.g;try{history.replaceState(null,'','#grammar')}catch(e){}render();window.scrollTo(0,0);}else startSession('v',n);break;}
  case 'speak':ev.stopPropagation();speak(t.dataset.t);break;
  case 'review':closeSheet();startSession('review');break;
  case 'gopen':GOPEN=+t.dataset.i;render();window.scrollTo(0,0);break;
  case 'gclose':GOPEN=null;render();break;
  case 'gpractice':startSession('g',+t.dataset.i);break;
  case 'quit':endSession();break;
  case 'flip':if(ev.target.closest('[data-act="speak"]'))return;t.classList.toggle('on');break;
  case 'fknow':case 'fagain':{const w=cur().w,r=S.words[w.fr];if(a==='fknow'){if(!r)S.words[w.fr]={b:1,d:Date.now()+DAY,ok:0,ko:0};}else{S.words[w.fr]={b:0,d:Date.now(),ok:r?r.ok:0,ko:r?r.ko:0};}save();next();break;}
  case 'opt':if(SS.answered)return;SS.sel=+t.dataset.i;document.querySelectorAll('.opts .opt').forEach((b,i)=>b.classList.toggle('sel',i===SS.sel));{const cb=$('#checkbtn');if(cb)cb.disabled=false;}if(cur().t==='mcif')speak(cur().opts[SS.sel]);break;
  case 'place':if(SS.answered)return;SS.placed.push(+t.dataset.i);renderSess();break;
  case 'unplace':if(SS.answered)return;SS.placed.splice(+t.dataset.k,1);renderSess();break;
  case 'check':check();break;
  case 'next':next();break;
  case 'acc':{const i=$('#tin');if(!i)return;const s=i.selectionStart??i.value.length,e2=i.selectionEnd??i.value.length;i.value=i.value.slice(0,s)+t.dataset.c+i.value.slice(e2);i.focus();i.setSelectionRange(s+1,s+1);break;}
  case 'ml':matchTap('l',+t.dataset.i);break;
  case 'mr':matchTap('r',+t.dataset.i);break;
  case 'export':exportBackup();break;
  case 'import':{const f=$('#importfile');if(f){f.value='';f.click();}break;}
  case 'tsound':S.sound=!S.sound;save();render();break;
  case 'tfree':S.free=!S.free;save();render();break;
  case 'goal':S.goal=+t.dataset.g;save();render();break;
  case 'reset':if(!RESETARM){RESETARM=true;render();setTimeout(()=>{if(RESETARM){RESETARM=false;if(VIEW==='profile')render();}},5000);}else{RESETARM=false;S=fresh();localSave();render();}break;
  }});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){WQ=ev.target.value;$('#wl').innerHTML=wordList();}});
document.addEventListener('change',ev=>{if(ev.target.id==='uf'){WU=ev.target.value;$('#wl').innerHTML=wordList();}if(ev.target.id==='importfile'&&ev.target.files[0])importBackup(ev.target.files[0]);});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('.veil'))closeSheet();return;}
  if(!SS||!$('#sess'))return;const e=cur();if(!e)return;
  if(ev.key==='Enter'){ev.preventDefault();if($('#nextbtn')){next();return;}if(e.t==='flash'){next();return;}if(!SS.answered)check();return;}
  if(e.t==='flash'&&ev.key===' '){ev.preventDefault();const f=$('#flip');if(f)f.classList.toggle('on');return;}
  if(!SS.answered&&e.opts&&/^[1-4]$/.test(ev.key)&&document.activeElement.id!=='tin'){const i=+ev.key-1;if(i<e.opts.length){SS.sel=i;document.querySelectorAll('.opts .opt').forEach((b,k)=>b.classList.toggle('sel',k===i));const cb=$('#checkbtn');if(cb)cb.disabled=false;}}
});
render();
</script>
</body>
</html>
