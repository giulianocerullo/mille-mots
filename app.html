<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mille Mots · Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: single column app, iOS-clean cards, "./" mono labels; brand = blue square "m." with a red dot */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EBEEF4; --line:#DFE3EB;
  --ink:#131722; --ink-2:#596173; --ink-3:#8C93A3;
  --blue:#2C59E0; --blue-deep:#1C3FAE; --blue-soft:#E3EAFC; --on-accent:#FFFFFF;
  --red:#E2453A; --red-deep:#AF2D24; --red-soft:#FCE6E4;
  --green:#15995A; --green-deep:#0E7142; --green-soft:#DBF3E6;
  --gold:#F0A800; --gold-deep:#B57F00; --gold-soft:#FFF2CC; --gold-ink:#7A5400;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:22px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1017; --surface:#161A23; --surface-2:#1F2430; --line:#2A303D;
  --ink:#EDEFF4; --ink-2:#A3AABA; --ink-3:#6E7687;
  --blue:#6684FF; --blue-deep:#3B57C9; --blue-soft:#1C2647; --on-accent:#FFFFFF;
  --red:#FF6B5F; --red-deep:#B8392F; --red-soft:#3A1E1C;
  --green:#3CCB83; --green-deep:#1F8A56; --green-soft:#16301F;
  --gold:#FFC23D; --gold-deep:#B5861A; --gold-soft:#3A2F12; --gold-ink:#FFC23D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A23; --surface-2:#1F2430; --line:#2A303D;
  --ink:#EDEFF4; --ink-2:#A3AABA; --ink-3:#6E7687;
  --blue:#6684FF; --blue-deep:#3B57C9; --blue-soft:#1C2647; --on-accent:#FFFFFF;
  --red:#FF6B5F; --red-deep:#B8392F; --red-soft:#3A1E1C;
  --green:#3CCB83; --green-deep:#1F8A56; --green-soft:#16301F;
  --gold:#FFC23D; --gold-deep:#B5861A; --gold-soft:#3A2F12; --gold-ink:#FFC23D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:currentColor}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.mark{width:34px;height:34px;border-radius:11px;background:var(--blue);color:var(--on-accent);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 3px 0 var(--blue-deep);position:relative;flex:none}
.mark i{position:absolute;right:5px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:0;display:block;margin-top:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.03em;border-radius:16px;padding:14px 22px;background:var(--blue);color:var(--on-accent);box-shadow:0 4px 0 var(--blue-deep);transition:transform .06s,box-shadow .06s;text-transform:uppercase;font-size:15px;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-deep)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-deep)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-3);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.block{width:100%}
.veil{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out;max-height:90vh;overflow-y:auto}
@media (min-width:640px){.veil{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{font-size:26px;font-weight:800}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:10px 12px}
.err{font-size:14px;color:var(--red);background:var(--red-soft);border-radius:14px;padding:10px 12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:780px;margin:0 auto;padding-block:0 80px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chip.fire{color:var(--gold)} .chip.xp{color:var(--blue)} .chip.off{color:var(--ink-3)}
@media (max-width:420px){.brand>span:last-child{display:none}.chip{padding:5px 8px}}
nav.dots{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 16px}
nav.dots::-webkit-scrollbar{display:none}
nav.dots button{font-family:var(--f-mono);font-size:14px;padding:7px 12px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
nav.dots button:hover{color:var(--ink);background:var(--surface-2)}
nav.dots button.on{background:var(--ink);color:var(--bg)}
section{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
section > h2{font-size:24px;font-weight:800}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
/* home */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px}
.hero h1{font-size:clamp(28px,5.4vw,40px);line-height:1.04;font-weight:800}
.hero p{margin:6px 0 0}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip>div{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip b{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.strip .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.strip .bar i{display:block;height:100%;background:var(--green)}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--line)}}
.btn-play svg{width:18px;height:18px}
/* path */
.unit{margin-block:32px 8px}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--blue);color:var(--on-accent);border-radius:var(--r);padding:16px 20px;box-shadow:0 4px 0 var(--blue-deep)}
.uhead .eyebrow{color:var(--on-accent);opacity:.75}
.uhead h2{font-size:22px;font-weight:800}
.uhead p{margin:2px 0 0;opacity:.85;font-size:14px}
.uhead .prog{font-family:var(--f-mono);font-size:13px;font-weight:700;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:999px;white-space:nowrap}
.unit.alt .uhead{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--ink-2)}
.unit.alt .uhead .eyebrow{color:var(--bg)}
.unit.alt .uhead .prog{background:rgba(127,127,127,.25)}
.track{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:30px 4px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:72px;height:66px;border-radius:50%;background:var(--blue);color:var(--on-accent);box-shadow:0 6px 0 var(--blue-deep);display:grid;place-items:center;font-size:26px;transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-deep)}
.node.g{border-radius:22px}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep)}
.node.lock{background:var(--surface-2);color:var(--ink-3);box-shadow:0 6px 0 var(--line)}
.node.cur{outline:6px solid var(--blue-soft);outline-offset:4px}
.nlabel{font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;max-width:140px;line-height:1.25}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:12px}
.stars .e{color:var(--line)}
.bubble{position:absolute;top:-38px;background:var(--surface);color:var(--blue);border:2px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.06em;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips span{background:var(--surface-2);border-radius:10px;padding:4px 10px;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-size:20px;flex:none}
/* session */
.sess{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sbar{display:flex;align-items:center;gap:14px;max-width:680px;width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.pbar{flex:1;height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.pbar b{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.sbody{flex:1;overflow-y:auto;width:100%}
.sinner{max-width:620px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sinner h2{font-size:24px;font-weight:800}
.prompt{display:flex;align-items:center;gap:14px;min-width:0}
.prompt .w{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.15;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;background:var(--surface);font-size:18px;font-weight:600}
.opt kbd{font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line);border-radius:7px;padding:1px 7px;color:var(--ink-3);font-weight:500}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt[disabled]{cursor:default}
.tin{width:100%;font:600 20px var(--f-body);padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.tin:focus{border-color:var(--blue);outline:none}
.tin.inline{width:auto;min-width:6ch;max-width:100%;display:inline-block;padding:4px 10px;font-family:var(--f-display);font-weight:800;font-size:inherit;line-height:1.1;border-radius:12px;vertical-align:baseline}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{font:600 16px var(--f-body);min-width:40px;padding:8px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:3px}
.hint{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.slots{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-bottom:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font:600 18px var(--f-body);padding:9px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px}
.tile.used{visibility:hidden}
.tile.right{border-color:var(--green);color:var(--green)}
.tile.wrong{border-color:var(--red);color:var(--red)}
.foot{border-top:2px solid var(--line);background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot .fi{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.foot.ok{background:var(--green-soft);border-color:transparent}
.foot.ko{background:var(--red-soft);border-color:transparent}
.fb{flex:1 1 240px;min-width:0}
.fb strong{font-family:var(--f-display);font-size:22px;display:block}
.foot.ok .fb{color:var(--green)} .foot.ko .fb{color:var(--red)}
.foot .btn{flex:1 1 200px}
.flip{perspective:1200px;height:300px;cursor:pointer}
.flip-in{position:relative;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:2px solid var(--line);border-bottom-width:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--blue);color:var(--on-accent);border-color:var(--blue-deep)}
.face .w{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;overflow-wrap:anywhere}
.face .hint{opacity:.7;color:inherit}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
.tag.new{background:var(--gold-soft);color:var(--gold-ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}
.match .opt{justify-content:center;text-align:center;font-size:16px;min-height:58px;overflow-wrap:anywhere}
.match .opt.gone{opacity:.35;border-color:var(--green);color:var(--green)}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--gold);color:#3A2A00;font-family:var(--f-display);font-weight:800;font-size:22px;padding:10px 18px;border-radius:16px;z-index:60;animation:pop .9s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.8);opacity:0}20%{transform:translate(-50%,0) scale(1.05);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.result{text-align:center;align-items:center}
.result h2{font-size:clamp(30px,7vw,40px)}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.rgrid .card{padding:14px;border-width:2px}
.rgrid .card b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
/* grammar */
.lvlgroup{display:flex;flex-direction:column;gap:10px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ggrid{grid-template-columns:1fr}}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .1s;padding:16px}
.gcard:hover{transform:translateY(-2px)}
.gcard h3{font-size:18px}
.gcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gdoc{display:flex;flex-direction:column;gap:16px}
.gdoc h1{font-size:clamp(28px,6vw,40px);font-weight:800}
.gbody{max-width:65ch;display:flex;flex-direction:column;gap:12px;min-width:0}
.gbody p{margin:0}
.gbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table.gt{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gt th,.gt td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.gt tr:last-child td{border-bottom:0}
.gt th{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink-3);background:var(--surface-2)}
.gt td b{color:var(--blue)}
.tip{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-size:15px}
.ex{font-family:var(--f-display);font-weight:600}
/* words */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{font:500 16px var(--f-body);padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.tools input{flex:1 1 220px;min-width:0}
.tools select{flex:0 1 240px;min-width:0}
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .f{font-weight:700;overflow-wrap:anywhere}
.wrow .i{color:var(--ink-2);overflow-wrap:anywhere}
.wrow .speak{width:34px;height:34px;border-radius:10px;font-size:16px}
.wsec{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding:12px 14px 6px;background:var(--surface-2)}
.mast{display:flex;gap:2px}
.mast i{width:6px;height:14px;border-radius:2px;background:var(--surface-2)}
.mast i.on{background:var(--green)}
@media (max-width:480px){.wrow{grid-template-columns:minmax(0,1fr) auto auto}.wrow .i{grid-column:1;grid-row:2;margin-top:-8px;font-size:14px}.wrow .mast{grid-row:1/3;grid-column:2}.wrow .speak{grid-row:1/3;grid-column:3}}
/* review */
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;margin-top:10px}
.boxes div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.boxes b{width:100%;border-radius:10px 10px 4px 4px;background:var(--blue);min-height:4px}
.boxes span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:center;line-height:1.2}
.boxes em{font-style:normal;font-family:var(--f-mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
/* profile */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}}
.lvlbar{position:relative;height:12px;border-radius:6px;background:var(--surface-2);margin:14px 0 8px;overflow:hidden}

/* 0 */ {lvl:'A1',title:'Definite articles',sub:'le · la · l\' · les',body:`
<p>Every French noun is masculine or feminine. "The" has four forms.</p>
<div class="tw"><table class="gt"><tr><th></th><th>form</th><th>example</th></tr>
<tr><td>masculine</td><td><b>le</b></td><td>le livre · the book</td></tr>
<tr><td>feminine</td><td><b>la</b></td><td>la table · the table</td></tr>
<tr><td>before a vowel or silent h</td><td><b>l'</b></td><td>l'ami, l'eau, l'hôtel</td></tr>
<tr><td>plural (m and f)</td><td><b>les</b></td><td>les livres, les tables</td></tr></table></div>
<p>French also uses the article for general statements, where English drops it: <span class="ex">J'aime le café</span> = I like coffee.</p>
<div class="tip">Learn every noun with its article: <i>la mer</i>, not just <i>mer</i>. The gender is part of the word.</div>`,
ex:[['___ livre est sur ___ table.',['le / la','la / le','les / la'],0,'livre is masculine, table is feminine.'],
["J'aime ___ eau minérale.",["l'",'la','le'],0,"Before a vowel, le/la become l'."],
['___ enfants jouent dans le jardin.',['Les','Le','La'],0,'Plural is always les.'],
["___ mer est belle aujourd'hui.",['La','Le',"L'"],0,'mer is feminine.'],
['Où est ___ hôtel ?',["l'",'le','la'],0,"The h in hôtel is silent, so the article elides."],
["J'adore ___ chocolat.",['le','du','un'],0,'General likes take the definite article.']],
s:[['o','Le chat est sous la table.','The cat is under the table.'],['w',"___ école est fermée.","L'","école starts with a vowel","Before a vowel: l'."]]},

<div class="tw"><table class="gt"><tr><th></th><th>a / some (countable)</th><th>some (uncountable)</th></tr>
<tr><td>masculine</td><td><b>un</b> chat</td><td><b>du</b> pain</td></tr>
<tr><td>feminine</td><td><b>une</b> maison</td><td><b>de la</b> viande</td></tr>

<p>Most plurals add a silent <b>-s</b>.</p>
<div class="tw"><table class="gt"><tr><th>rule</th><th>example</th></tr>
<tr><td>+ s</td><td>un livre → des livre<b>s</b></td></tr>
<tr><td>-eau, -eu → + x</td><td>un bateau → des bateau<b>x</b> · un jeu → des jeu<b>x</b></td></tr>
<tr><td>-al → -aux</td><td>un cheval → des chev<b>aux</b> · un journal → des journ<b>aux</b></td></tr>
<tr><td>-s, -x, -z stay the same</td><td>le bras → les bras · le prix → les prix</td></tr>
<tr><td>irregular</td><td>un œil → des <b>yeux</b></td></tr></table></div>
<p>Feminine of people: <span class="ex">ami → amie</span>, <span class="ex">boulanger → boulangère</span>, <span class="ex">vendeur → vendeuse</span>, <span class="ex">acteur → actrice</span>.</p>
